 to these three populations.  Why on earth would we want to hurt these people?\n\n--We moved to San Anselmo because we loved the community.  Live on the Avenue is amazing, but so is San Anselmo Avenue on any given Sunday morning.  We can't walk down the street without bumping into people we know, high-fiving, giving hugs, digging the live jazz coming from the coffee shop.  This is a town where people care about each other. Fairfax is too.  Let's prove that we love our towns and each other by voting Yes.  \n\n--My momma (z\"l) taught me to always vote to support schools. ALWAYS.  \"What a beautiful day it will be when our schools have all of the money they need and the military needs to hold a bake sale to buy a bomber\" she used to say. So let's all do it for our mommas.  \n\nI'm nervous as heck about this, and need a win to restore my faith in humanity.  I think we can do it, folks, I really do.", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-25T21-48-53Z__post__edited.png"}, {"comment_id": "post", "author": "S San Francisco Chronicle Local publisher · 1 hr ago", "klass": "edited", "run_id": "2026-05-25T23:48:56Z", "observed_at": "2026-05-25T23:49:44Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "1 hr ago", "edited_marker_text": null, "body_text": "Linda Perry calls Billie Joe Armstrong 'a little pussy' over scrapped Green Day album talks Read article", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-25T23-48-56Z__post__edited.png"}, {"comment_id": "post", "author": "Adrian B.", "klass": "edited", "run_id": "2026-05-26T00:18:54Z", "observed_at": "2026-05-26T00:19:40Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "1 day ago", "edited_marker_text": null, "body_text": "Setting the Record Straight on the AIM Initiative\n\nEmails and flyers are circulating in our community with serious factual errors about AIM. Sausalito deserves an honest conversation about our waterfront — not one built on misinformation designed to create fear, uncertainty, and doubt. Before you form an opinion, here's what's actually true:\n\nWhat AIM does NOT do:\n     Rezone for housing, hotels, or condominiums. Not permitted, period\n     Replace the 32-ft height limit everywhere. The 47-ft maximum applies only to the Industrial zone, and is still lower than the ICB building already on site\n     Hand unchecked power to City Council — it returns routine decisions to the same planning process every other California city uses, with public hearings and environmental review\n     Take away your voting power — Ordinance 1022 was decided by Sausalito voters forty years ago. AIM gives today's residents that same democratic opportunity: to decide for ourselves what our waterfront should be. \n\nWhat AIM DOES do:\n     Lets fishermen sell their catch, artists sell their work, bakers sell their bread. All currently prohibited under 40-year-old Ordinance 1022\n     Makes it economically viable to build real boat repair facilities, industrial workshops, and spaces for artists. Nothing viable has been built here in four decades\n     Addresses a root cause of blight: building rules so restrictive that investment is essentially impossible\n     Protects the existing uses at the historic Arques Shipyard and ICB against displacement.\n\nThe numbers the opposition isn't sharing:\n     Marinship generates $10K/acre in tax revenue vs. $70K/acre downtown\n     Industrial rents here top $3/sq ft — among the Bay Area's highest — because supply is artificially capped\n\nBefore making up your mind, we encourage you to visit sausalitothrive.org and learn more about the AIM Initiative. Our main website and detailed FAQ answers the most common questions. We've also posted a full point-by-point response to every claim circulating in the community at sausalitothrive.org/fact-vs-fiction . We just ask that you read it with an open mind. Questions? Reach us at info@sausalitothrive.org — we're happy to talk or hop on a zoom to false, "parent_comment_id": null, "timestamp_text": "2 days ago", "edited_marker_text": null, "body_text": "Setting the Record Straight on the AIM Initiative\n\nEmails and flyers are circulating in our community with serious factual errors about AIM. Sausalito deserves an honest conversation about our waterfront — not one built on misinformation designed to create fear, uncertainty, and doubt. Before you form an opinion, here's what's actually true:\n\nWhat AIM does NOT do:\n     Rezone for housing, hotels, or condominiums. Not permitted, period\n     Replace the 32-ft height limit everywhere. The 47-ft maximum applies only to the Industrial zone, and is still lower than the ICB building already on site\n     Hand unchecked power to City Council — it returns routine decisions to the same planning process every other California city uses, with public hearings and environmental review\n     Take away your voting power — Ordinance 1022 was decided by Sausalito voters forty years ago. AIM gives today's residents that same democratic opportunity: to decide for ourselves what our waterfront should be. \n\nWhat AIM DOES do:\n     Lets fishermen sell their catch, artists sell their work, bakers sell their bread. All currently prohibited under 40-year-old Ordinance 1022\n     Makes it economically viable to build real boat repair facilities, industrial workshops, and spaces for artists. Nothing viable has been built here in four decades\n     Addresses a root cause of blight: building rules so restrictive that investment is essentially impossible\n     Protects the existing uses at the historic Arques Shipyard and ICB against displacement.\n\nThe numbers the opposition isn't sharing:\n     Marinship generates $10K/acre in tax revenue vs. $70K/acre downtown\n     Industrial rents here top $3/sq ft — among the Bay Area's highest — because supply is artificially capped\n\nBefore making up your mind, we encourage you to visit sausalitothrive.org and learn more about the AIM Initiative. Our main website and detailed FAQ answers the most common questions. We've also posted a full point-by-point response to every claim circulating in the community at sausalitothrive.org/fact-vs-fiction . We just ask that you read it with an open mind. Questions? Reach us at info@sausalitothrive.org — we're happy to talk or hop on a zoom to to tell you more and answer your questions. ... see more Sausalito Waterfront AIM Initiative — Sign the Petition sausalitothrive.org", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-27T13-48-36Z__post__edited.png"}, {"comment_id": "comment_1611358460", "author": null, "klass": "new", "run_id": "2026-05-27T14:18:49Z", "observed_at": "2026-05-27T14:19:34Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "He certainly has my vote. This reductive description of him as a 'billionaire' rather than looking at his record supporting progressive policy is absurd. Putting all wealthy folks into one box is just as prejudiced as any other generalization. We can do better than that by spend two minutes looking at his history of donations to nonprofits over the last decade.", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-27T14-18-49Z__comment_1611358460__new.png"}, {"comment_id": "post", "author": "K KQED Local publisher · 3 hr ago", "klass": "edited", "run_id": "2026-05-27T14:18:49Z", "observed_at": "2026-05-27T14:19:34Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "3 hr ago", "edited_marker_text": null, "body_text": "Tom Steyer's Closing Pitch at KQED Takes on Affordability Crisis, Corporate 'Enemies' Read article", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-27T14-18-49Z__post__edited.png"}, {"comment_id": "comment_1611358460", "author": null, "klass": "deleted", "run_id": "2026-05-27T15:18:32Z", "observed_at": "2026-05-27T15:18:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "post", "author": "C", "klass": "edited", "run_id": "2026-05-27T17:18:21Z", "observed_at": "2026-05-27T17:19:07Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "49 min ago", "edited_marker_text": null, "body_text": "WHAT THE HELL?  Huge debris pile  left on Girard at Locust, for over a week and taking up two parking spaces.  I have contacted City to see of they will remove but yee gads, are some of my neighbors this clueless over everyone's need for parking?", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-27T17-18-21Z__post__edited.png"}, {"comment_id": "post", "author": "Paul S.", "klass": "edited", "run_id": "2026-05-27T17:48:54Z", "observed_at": "2026-05-27T17:49:41Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "15 min ago", "edited_marker_text": null, "body_text": "Now, this is a development proposal that actually makes sense.\nInstead of trying to cram in more apartments, traffic and people into an already overbuilt Marin County, build it out on vacant land in Concord.\nThis will be a planned development, new schools, fire stations, complete new infrastructure to accommodate 12,000 new \"homes\" starting from scratch.\nThis should alleviate the pressure to build more in Marin where there is really not much room left for more population and traffic, and it's still in the Bay Area and in California, so it will satisfy the developers and politicians needs to build more \"housing\". We need to shift the new growth mandates out of Marin and over to the East Bay where there is actually room for it and where there is functioning public transportation. This could be a perfect example of a planned Transportation Oriented Development (TOD), when it is impossible to do such a thing in Marin County. https://www.ktvu.com/news/concord-approves-deal-navy-build-master-planned-community Concord inches closer to building master-planned community on old Navy base ktvu.com", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-27T17-48-54Z__post__edited.png"}, {"comment_id": "post", "author": "Wendy Louise Nog", "klass": "edited", "run_id": "2026-05-27T18:48:43Z", "observed_at": "2026-05-27T18:49:29Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "1 hr ago", "edited_marker_text": null, "body_text": "Would you hire a business owned by a Latino guy to build or work on your house?  \n\nI work with many local businesses in the trades doing websites and ads and general digital marketing...HVAC companies, roofers, builders, contractors, etc.  There is something that is shifting.  The younger business owners are Latino.  There just hasn't been an overwhelming interest from \"caucasian\" men to take up the trades. \n\nI want to share something that surprised me, and made me feel disappointed in \"us\".  Several of my Latino clients have expressed that they want to minimize that the business is Latino owned due to racism in decision-making, and also in how the team is respected and treated when on the job.  I am certain others must have thought it but didn't share with me.\n\nOne owner has every single team member with a certification in some element of the work that they do.  Others have team members with decades of experience.  These are highly skilled, highly trained craftsmen.  They are licensed and insured.\n\nDon't miss out on having a highly skilled team complete your home project due to their heritage!    We can be making these biased decisions without being aware of it.  Note to self as well.", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-27T18-48-43Z__post__edited.png"}, {"comment_id": "post", "author": "L", "klass": "edited", "run_id": "2026-05-27T19:18:11Z", "observed_at": "2026-05-27T19:18:34Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "57 min ago", "edited_marker_text": null, "body_text": "Why are Trump donors and Crypto Billionaires running ads in support of statement.  \n\nDeliverable is a personal statement or UC essay ( post August 1) in submission ready form.  Please DM me for more info/ rates/ etc. ... see more", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T00-48-34Z__post__edited.png"}, {"comment_id": "post", "author": "Safety Alerts powered by samdesk.io · 3 hr ago", "klass": "edited", "run_id": "2026-05-28T01:49:02Z", "observed_at": "2026-05-28T01:49:47Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "3 hr ago", "edited_marker_text": null, "body_text": "Traffic collision on southbound US-101 south of Rodeo Ave in Sausalito blocks left and center lanes. © Mapbox, © OpenStreetMap", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T01-49-02Z__post__edited.png"}, {"comment_id": "comment_1611829379", "author": null, "klass": "new", "run_id": "2026-05-28T02:18:03Z", "observed_at": "2026-05-28T02:18:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "What do you think the expansion of Juicebox in SoMA will mean for job opportunities in the area?", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T02-18-03Z__comment_1611829379__new.png"}, {"comment_id": "post", "author": "San Francisco Business Times Local publisher · 4 hr ago", "klass": "edited", "run_id": "2026-05-28T02:18:03Z", "observed_at": "2026-05-28T02:18:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "4 hr ago", "edited_marker_text": null, "body_text": "This AI startup is 'doubling down on San Francisco,' literally Read article", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T02-18-03Z__post__edited.png"}, {"comment_id": "comment_1611829379", "author": null, "klass": "deleted", "run_id": "2026-05-28T03:18:56Z", "observed_at": "2026-05-28T03:19:42Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1612010916", "author": null, "klass": "new", "run_id": "2026-05-28T03:18:56Z", "observed_at": "2026-05-28T03:19:42Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "What do you think about Theo Baker's take on the hidden aspects of Stanford's culture?", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T03-18-56Z__comment_1612010916__new.png"}, {"comment_id": "post", "author": "ABC7 News Local publisher · 1 hr ago", "klass": "edited", "run_id": "2026-05-28T03:18:56Z", "observed_at": "2026-05-28T03:19:42Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "1 hr ago", "edited_marker_text": null, "body_text": "'How to Rule the World': Stanford student journalist releases book about school's 'hidden' ecosystem Read article", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T03-18-56Z__post__edited.png"}, {"comment_id": "post", "author": "C", "klass": "edited", "run_id": "2026-05-28T03:48:35Z", "observed_at": "2026-05-28T03:49:16Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "1 min ago", "edited_marker_text": null, "body_text": "Glyphosate is in the news lately since it's being sprayed in our national forest  in Tahoe. You might also consider how it's used to spray on the food you consume, unless you eat only organic food. Check out this list I found regarding what you might want to avoid, especially when feeding your kids. We are very fortunate here in Marin to have locally grown organic produce and meat available. I'm grateful for markets like Good Earth that only carry organic products.", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T03-48-35Z__post__edited.png"}, {"comment_id": "comment_1612010916", "author": null, "klass": "deleted", "run_id": "2026-05-28T04:18:23Z", "observed_at": "2026-05-28T04:19:09Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "post", "author": "R", "klass": "edited", "run_id": "2026-05-28T04:18:23Z", "observed_at": "2026-05-28T04:19:09Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "29 min ago", "edited_marker_text": null, "body_text": "From Redwood High School May 27, 2026\n👏🏽👏🏽👏🏽\nA statement from The Bark concerning recent publicity\n\nRecent headlines surrounding the Bark and its interactions with school and district administration have been alarming, if not shocking. We have gained recognition not only from local publications like the Marin Independent Journal (IJ) and EdSource Oakland, but also nationally recognized publications such as the New York Post's \"California Post.\" While these stories have brought attention to our publication and some of our many important stories, we feel that important context may be missing that could help better inform readers.\nOn Feb. 23, select members of the Bark staff were informed that one person mentioned in our Instagram story about Marin towns mentioned in the Epstein Files was threatening to file legal action against the Tamalpais Union High School District (TUHSD) for libel and defamation. The post was researched using keyword searches of the Epstein Files. Principal Dr. Barnaby Payne then received a directive from Superintendent Dr. Courtney Goode for the Bark to redact the woman's name from our post.\nOn Feb. 24, after lengthy discussion, Bark leadership staff decided to remove the slide containing the woman's name from Instagram. While statements from certain individuals claim that the Bark staff felt scared or pressured by the district, this was not the case. With assistance from lawyers from the Student Press Law Center and our former adviser Erin Schneider, Bark staff knew they were protected under student free press rights granted by California Education Code 48907. Instead, after intense analysis of the post's wording and input from trusted adults, students involved decided to take the time to ensure they were not personally liable to legal action and decided to remove the post. Bark staff communicated to school and district staff that it was an entirely independent decision by students involved to remove the slide.\nThe districts directive seemed vague and unreasonable, even if it was rooted in fear. Before removing the slide, select Bark staff wished to speak with Dr. Goode and Dr. Payne to understand their request further. This was, however, made impossible by world events, as Dr. Payne was stuck in Mexico due to ongoing violence in Puerto Vallarta. The removal could be attributed to our inability to meet with Dr.\nPayne, as when Bark staff met with Dr. Payne and Dr. Goode, a quick and simple conversation about the sources for our post restored the district and school administration's full confidence in our decisions, and the slide was quickly restored to Instagram, where it can still be seen.\nWhile the Bark has had perhaps more interactions with district staff than usual, TUHSD is required to investigate all complaints lodged against its programs, staff and more. This was why the district was required to investigate the cover published in February, which received complaints for its depiction of a protester with a sign expressing anti-Zionist sentiment. There are also, contrary to some reporting currently no complaints against the Bark or the district as a whole regarding the Bark. Unfortunately, reporting can be controversial, meaning complaints and, as we have learned, increased interaction with district staff. While we are grateful for the attention and readership our publication has received, we hope to move forward and focus on more current issues of greater importance and substance than something that could be confined to a simple misunderstanding. While it was unfortunate that the district's decisions were not well-researched and abrupt, they have met with the Bark leadership multiple times since and honored our free press rights. We hope these reflections provide some context for the muddied stories surrounding our publication.\nRegards,\nThe fedward Bark", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T04-18-23Z__post__edited.png"}, {"comment_id": "post", "author": "Kelsey Bohn", "klass": "edited", "run_id": "2026-05-28T05:18:07Z", "observed_at": "2026-05-28T05:18:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "1 hr ago", "edited_marker_text": null, "body_text": "Massive bobcat on Corte Morada today at about 7:30 PM!", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T05-18-07Z__post__edited.png"}, {"comment_id": "post", "author": "Southern Marin Fire District", "klass": "edited", "run_id": "2026-05-28T06:18:28Z", "observed_at": "2026-05-28T06:19:13Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "11 hr ago", "edited_marker_text": null, "body_text": "Join the Southern Marin Fire District Board of Directors for our monthly meeting and stay informed on District operations and progress on key strategic initiatives.⁠\n⁠\nThe meeting will be held this evening, Wednesday, May 27 beginning at 6:00 PM at the Administrative Office, 28 Liberty Ship Way, Suite 2800, Sausalito.⁠\n⁠\nLearn more: www.smfd.org/meetings-and-agendas", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T06-18-28Z__post__edited.png"}, {"comment_id": "post", "author": "S SFist Local publisher · 1 day ago", "klass": "edited", "run_id": "2026-05-28T06:48:18Z", "observed_at": "2026-05-28T06:48:55Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "1 day ago", "edited_marker_text": null, "body_text": "Day Around the Bay: Alameda's Popular USS Hornet Hit Hard By New Restrictions Read article", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T06-48-18Z__post__edited.png"}, {"comment_id": "post", "author": "H", "klass": "edited", "run_id": "2026-05-28T07:18:35Z", "observed_at": "2026-05-28T07:19:36Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "29 min ago", "edited_marker_text": null, "body_text": "I just saw a tiktok video for a young asian man with leukemia named @warrenzshen … his mother is pleading with young people age 18-35 of asian decent to get a buccal (cheek) swab to join a stem cell registry @NMDP … stem cells can be taken from blood donations now, so donating to save a life has become much easier than before … pls make time to help this young man if you are young & asian … surely there is a match somewhere in the bay area ?!! ❤️❤️❤️ ... see more", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T07-18-35Z__post__edited.png"}, {"comment_id": "post", "author": "A", "klass": "edited", "run_id": "2026-05-28T08:18:41Z", "observed_at": "2026-05-28T08:19:27Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "8 hr ago", "edited_marker_text": null, "body_text": "I have a bit of experience with San Francisco planning. When I lived in the Marina, I was a member of a neighborhood group that attempted to negotiate with a developer over a new hotel. I learned a lot. The hotel would have been surrounded by residential buildings.\n\nFor one thing, I learned that many of the rules are unwritten. For example, the developer tried to add a rooftop restaurant at the last minute. There is one such restaurant in the Mission which has received numerous noise complaints. A rooftop restaurant in a residential area is a nightmare. The Planning Commission unanimously voted to remove this from the hotel in the Marina after we brought it to their attention. There is no written rule against something like this.\n\nBefore Wiener's law, most of San Francisco was subject to \"conditional use\". That meant it was subject to approval by the Planning Department and Planning Commission. The Planning Commission was allowed to remove the restaurant because the lot was subject to conditional use. \n\nHow many other situations are there like this? The zoning rules were not written for every single loophole that a developer might come up with, but thanks to Wiener's brain dead zoning laws, who knows what we will see?", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T08-18-41Z__post__edited.png"}, {"comment_id": "post", "author": "Lemon Aide Project 15 hr ago", "klass": "edited", "run_id": "2026-05-28T09:18:52Z", "observed_at": "2026-05-28T09:19:29Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "15 hr ago", "edited_marker_text": null, "body_text": "🍕 Mark your calendars for June 5th and come support a great local cause while enjoying some incredible pizza at Extreme Pizza Novato! 🍕\n\nExtreme Pizza is partnering with Lemon Aide Project to help support our upcoming Relaxation lounge at the Petaluma Fair, where we’ll be providing a cooling and calming space for families, seniors, and fairgoers needing relief from the heat, crowds, and stress during the fair.\n\nA portion of sales on June 5th will directly help fund hydration supplies, cooling items, snacks, first aid resources, and comfort essentials for the community during this major event.\n\nWe are beyond grateful to Extreme Pizza Novato for stepping up to support local emergency preparedness and community care efforts right here in the North Bay. Community partnerships like this truly make a difference.\n\nStop by, grab a slice, bring your friends, and help support a project built to help people when they need it most. ❤️\n\n📍 Extreme Pizza Novato\n104 Vintage Way, Novato, CA\n📅 June 5th\n\nIf you can’t attend, donations can also be made directly through the QR code on the flyer. #LemonAideProject #Novato #PetalumaFair #CommunitySupport #NorthBay DisasterRelief", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T09-18-52Z__post__edited.png"}, {"comment_id": "post", "author": "R", "klass": "edited", "run_id": "2026-05-28T09:48:36Z", "observed_at": "2026-05-28T09:49:21Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "6 hr ago", "edited_marker_text": null, "body_text": "From Redwood High School May 27, 2026\n👏🏽👏🏽👏🏽\nA statement from The Bark concerning recent publicity\n\nRecent headlines surrounding the Bark and its interactions with school and district administration have been alarming, if not shocking. We have gained recognition not only from local publications like the Marin Independent Journal (IJ) and EdSource Oakland, but also nationally recognized publications such as the New York Post's \"California Post.\" While these stories have brought attention to our publication and some of our many important stories, we feel that important context may be missing that could help better inform readers.\nOn Feb. 23, select members of the Bark staff were informed that one person mentioned in our Instagram story about Marin towns mentioned in the Epstein Files was threatening to file legal action against the Tamalpais Union High School District (TUHSD) for libel and defamation. The post was researched using keyword searches of the Epstein Files. Principal Dr. Barnaby Payne then received a directive from Superintendent Dr. Courtney Goode for the Bark to redact the woman's name from our post.\nOn Feb. 24, after lengthy discussion, Bark leadership staff decided to remove the slide containing the woman's name from Instagram. While statements from certain individuals claim that the Bark staff felt scared or pressured by the district, this was not the case. With assistance from lawyers from the Student Press Law Center and our former adviser Erin Schneider, Bark staff knew they were protected under student free press rights granted by California Education Code 48907. Instead, after intense analysis of the post's wording and input from trusted adults, students involved decided to take the time to ensure they were not personally liable to legal action and decided to remove the post. Bark staff communicated to school and district staff that it was an entirely independent decision by students involved to remove the slide.\nThe districts directive seemed vague and unreasonable, even if it was rooted in fear. Before removing the slide, select Bark staff wished to speak with Dr. Goode and Dr. Payne to understand their request further. This was, however, made impossible by world events, as Dr. Payne was stuck in Mexico due to ongoing violence in Puerto Vallarta. The removal could be attributed to our inability to meet with Dr.\nPayne, as when Bark staff met with Dr. Payne and Dr. Goode, a quick and simple conversation about the sources for our post restored the district and school administration's full confidence in our decisions, and the slide was quickly restored to Instagram, where it can still be seen.\nWhile the Bark has had perhaps more interactions with district staff than usual, TUHSD is required to investigate all complaints lodged against its programs, staff and more. This was why the district was required to investigate the cover published in February, which received complaints for its depiction of a protester with a sign expressing anti-Zionist sentiment. There are also, contrary to some reporting currently no complaints against the Bark or the district as a whole regarding the Bark. Unfortunately, reporting can be controversial, meaning complaints and, as we have learned, increased interaction with district staff. While we are grateful for the attention and readership our publication has received, we hope to move forward and focus on more current issues of greater importance and substance than something that could be confined to a simple misunderstanding. While it was unfortunate that the district's decisions were not well-researched and abrupt, they have met with the Bark leadership multiple times since and honored our free press rights. We hope these reflections provide some context for the muddied stories surrounding our publication.\nRegards,\nThe fedward Bark", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-28T09-48-36Z__post__edited.png"}, mment_id": null, "timestamp_text": "42 min ago", "edited_marker_text": null, "body_text": "50 years ago Fleetwood Mac recorded one of the top selling records of all time, right here in Sausalito. \n\nIf you're a Marin music fan, you're going to love the classic rock version of our Sausalito Music History Party. Listen to stories about the recording of Fleetwood Mac's Rumours album, The Grateful Dead, Santana, Sammy Hagar, Jefferson Airplane, and more.\n\nThe DJ is Katiana Giacona, who wrote an excellent history book on the former Record Plant Sausalito studios, also was known as THE PLANT Studios and Harmonia, and now is 2200 Studios. She'll play records, tell stories, and have album liner notes you can read.\n\nSaturday 6/6 from noon to 4:30. At the beautiful Eria venue, just above the Trident, with sweeping bay views. There's a full bar and great food available to purchase. \n\nComment music and I’ll send it to you (early pricing tier currently available). 0:00", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-29T08-18-30Z__post__edited.png"}, {"comment_id": "comment_1612791923", "author": null, "klass": "deleted", "run_id": "2026-05-29T08:48:13Z", "observed_at": "2026-05-29T08:48:56Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "post", "author": "J", "klass": "edited", "run_id": "2026-05-29T08:48:13Z", "observed_at": "2026-05-29T08:48:56Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "5 hr ago", "edited_marker_text": null, "body_text": "This bike has been in the bushes by the baseball field at Cove Park for a few days. If you recognize it, please let me know. We’ll be glad to get it back to you", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-29T08-48-13Z__post__edited.png"}, {"comment_id": "comment_1612546876", "author": null, "klass": "new", "run_id": "2026-05-29T09:48:52Z", "observed_at": "2026-05-29T09:49:51Z", " t__edited.png"}, {"comment_id": "comment_1612941919", "author": null, "klass": "deleted", "run_id": "2026-05-29T11:48:19Z", "observed_at": "2026-05-29T11:49:12Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "post", "author": "Robin Wolaner", "klass": "edited", "run_id": "2026-05-29T11:48:19Z", "observed_at": "2026-05-29T11:49:12Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "20 hr ago", "edited_marker_text": null, "body_text": "Our town in the news, and not in a good way. Should not have a paywall https://www.wsj.com/lifestyle/sausalito-yacht-club-commodore-marisa-mcarthur-b89cc504?st=zvUmnB&reflink=desktopwebshare_permalink", "screenshot": "data/posts/p_Qdmb_bfbssGf/captures/2026-05-29T11-48-19Z__post__edited.png"}]}, {"slug": "p_pg2PjB_kYccZ", "url": "https://nextdoor.com/p/pg2PjB_kYccZ", "first_seen_at": "2026-05-25T14:41:57Z", "last_scrape_at": "2026-05-29T12:19:25Z", "last_scrape_result": "ok", "totals": {"seen": 25, "live": 0, "edited": 0, "deleted": 25}, "post_body": "What do you think about the arts, industry and maritime businesses in Sausalito's Marinship? \n\nA group of citizens are making an effort to bring this issue to a ballot measure, called the AIM initiative, which amends a 40 year old law to unlock the potential of the Marinship and preserve what makes Sausalito special. \n\nThe initiative allows makers to sell the things they make there. It allows underutilized parcels to become new studios and workshops; enables new businesses that benefit everyone (like local coffee shops); generates much needed tax revenue to fund sea level rise work; and importantly increases access to our waterfront for all.\n\nThe initiative is supported by local institutions including Clipper Yacht Harbor, Fish, Fjord, and many other local businesses. \n\nI am collecting signatures now and we need 800 to get this onto the November ballot. If you are interested in learning more check out our website: SausalitoThrive.org If you'd like to sign the petition, please DM me. I am around MLK park everyday and we need a real in person signature for this to happen!", "comment_count": 25, "captures": [{"comment_id": "comment_1603274786", "author": "Dana Herrick", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "✅", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1603274786__new.png"}, {"comment_id": "comment_1603390649", "author": "J", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Sign me up! Thank you Aaron, Michelle and Adrian for all of your work on this. Tying future development to job creation and critical infrastructure needs is smart growth that will benefit all of Sausalito.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1603390649__new.png"}, {"comment_id": "comment_1603393996", "author": "R", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "I’ve signed the petition. The proposal makes so much sense for enhancing the waterfront and increasing tax revenue for Sausalito. Thanks Aaron for posting.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1603393996__new.png"}, {"comment_id": "comment_1603477020", "author": "J", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "I have signed the petition.   Let’s get this on the November ballot and pass it!  Sausalito needs Marinship to THRIVE!", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1603477020__new.png"}, {"comment_id": "comment_1603679883", "author": "Natasha D.", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "I love this idea and have already signed a petition! Let’s get this on the ballot.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1603679883__new.png"}, {"comment_id": "comment_1604457576", "author": "V", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "It's a scam it'll hurt all the industrial businesses and the membership do not sign it look into it further and you will see", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1604457576__new.png"}, {"comment_id": "comment_1604492672", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Please do look into it! We want an informed electorate, not i driven by fear, uncertainty and doubt. Unless you think all of Sausalito is a scam, it's hard to see how this is.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1604492672__new.png"}, {"comment_id": "comment_1604576043", "author": "D", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Vincent how will it hurt the businesses? Please give some examples. It’s my perspective that will only help grow businesses. I’ve lived here almost 60 years and I’m horrified by the state of the waterfront. I look forward to making it a viable place of commerce for local businesses and residents. I’d like to have another sort of downtown area where as a local that I can go and hang out in - to start…more restaurants - more parks - bike trail - community center with a pool. I’d like to have something like a Sam’s in this area of town. Please share why this is a bad idea? It makes no sense to me whatsoever why one would think this is a bad idea. I understand the fear of losing the “waterfront community” to gentrification, but don’t we want a nice clean place to live and play and use every day? We have to think in future terms. What do we want Sausalito to look like in five years, 10 years, 20 years. Do we want to keep our children in town with hopes opening up their own businesses for profit? Yes we do. Do we really want this bulk of land to look like a homeless encampment for the next 20 years. What does that say about Sausalito? The idea is mortifying to me and I just won’t stand for it in my backyard.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1604576043__new.png"}, {"comment_id": "comment_1605165966", "author": "Ginny Erwin", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Sounds like a wolf in sheep’s clothing. \nKeep the waterfront as is and work with what you have now. \nTake a look at the B of A art center. How many local artists are there? How popular is it for locals and tourists? \n\nWe need to keep the soul of our quiet waterfront intact. Don’t make this into something that will ruin the culture and beauty of what Sausalito currently has.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1605165966__new.png"}, {"comment_id": "comment_1605168887", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Ginny it's a shame younl dont want more artists and industrial users, and prefer vacant lots and rv storage. For me, only the first thing makes Sausalito special, not the second", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1605168887__new.png"}, {"comment_id": "comment_1605292709", "author": "D", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Ginny Yes, we absolutely need to keep the soul of Sausalito. Consider Sausalito in its entirety as your gated backyard. Would you rather have your yard overgrown with weeds and broken glass bottles, and perhaps dead animals  hidden somewhere under a broken down shed or would you like to have somebody else come in and pay to remodel your entire backyard replacing the shed with a tiny guest room or ADU or private art studio and plant roses and Lillie’s and jasmine to scent your property year round, even give you a hot tub? If all this will cost you pennies on the dollar,  would you consider it? Consider for a second of fixing up the waterfront area as fixing up your own property. In this respect, you’ll be able to have a lot of friends over shoeless and you won’t be embarrassed or fearful of injury or coming upon uninvited “guests” sleeping it off in your rose bushes. You’ll be able to entertain and throw birthday parties for your kids or your parents and do it all with your head held high, and pass your pride of ownership to your children and their children for as long as Sausalito exists.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1605292709__new.png"}, {"comment_id": "comment_1605696722", "author": "Simon W Snellgrove", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "The Federal government is about to issue an army Corps of Engineers report on Sea Level Rise. (SLR) Legislation is already drafted that would provide nationwide funding of approximately $55 Billion in funding for SLR of which California is likely to receive $36B. The Port of San Francisco is all over this and has available a lot of information available. I very much doubt that the AIM initiative would help - in fact, it is likely to be a drop in the bucket and, in fact, jeopardize Sausalito’s ability to benefit from the Fed/State funding.. Please do your homework before endorsing this initiative. Thanks", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1605696722__new.png"}, {"comment_id": "comment_1605697450", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Simon W yup and I did. Eligibility for the federal programs is enhanced by having credible plans for development and investment while maintaining the working waterfront. But if we do nothing, we'll be lacking the funds and pan to be \"all over\" the federal grants.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1605697450__new.png"}, {"comment_id": "comment_1605989847", "author": "Lisy Ruiz", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Dunie I love your idea for a public pool! I live in the marinship and hope to start a family here … yet, i can’t think of anywhere close by that i could teach kiddos how to swim 😅", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1605989847__new.png"}, {"comment_id": "comment_1606341554", "author": "Albert Strietmann", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Hi Aaron this initiative is being brought to the city council by a small group of business owners who really only have their own interests in mind. I don’t support AIM initiative because it would remove our ability to vote on important matters and place all the control directly in the lap of a handful of city council members. I hope you take a closer look at what’s being proposed and by whom.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1606341554__new.png"}, {"comment_id": "comment_1606347966", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Albert it's funny you say that. I am one of the authors of the proposed measure and I am not a land owner in the marinship nor a business owner there. I am a parent of two who lives on Coloma St and a concerned citizen looking to make our waterfront thrive.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1606347966__new.png"}, {"comment_id": "comment_1606366083", "author": "Albert Strietmann", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron oh interesting, you should consider getting to know some of the folks who are actively working on the waterfront. Many are multigenerational family owned businesses that support our other neighbors such as the floating home community and the many other working vessels in Sausalito. \n\nIt’s funny to imagine a thriving working waterfront without industrial protections…", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1606366083__new.png"}, {"comment_id": "comment_1606370912", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Albert happy to do more. I have actually met several folks while gathering signatures from marine carpenters to people building robots on the waterfront. No one wants to displace these important businesses and AIM wont do that. What almost everyone does want is to turn the underutilized land into more studios and workshops. They do want to address the infrastructure shortfalls without increasing taxes. This is that path.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1606370912__new.png"}, {"comment_id": "comment_1606395592", "author": "Albert Strietmann", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron have you tried to lease industrial space from the landlords that are in charge of the areas that are being shown as underutilized? Have you seen the work that is done is the current space? I’m not sure if you understand why the different yards appear the way they do today. KKMI just sold to a larger group, it’s totally profitable. Clipper has hosted many successful events. Just try to consider maybe your friends in these groups aren’t being honest with you about the topic. It will take more than a couple years to meet people and understand the dynamic between property owner, business owner and culture that we grew up in", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__comment_1606395592__new.png"}, {"comment_id": "post", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:41:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "16 May", "edited_marker_text": null, "body_text": "What do you think about the arts, industry and maritime businesses in Sausalito's Marinship? \n\nA group of citizens are making an effort to bring this issue to a ballot measure, called the AIM initiative, which amends a 40 year old law to unlock the potential of the Marinship and preserve what makes Sausalito special. \n\nThe initiative allows makers to sell the things they make there. It allows underutilized parcels to become new studios and workshops; enables new businesses that benefit everyone (like local coffee shops); generates much needed tax revenue to fund sea level rise work; and importantly increases access to our waterfront for all.\n\nThe initiative is supported by local institutions including Clipper Yacht Harbor, Fish, Fjord, and many other local businesses. \n\nI am collecting signatures now and we need 800 to get this onto the November ballot. If you are interested in learning more check out our website: SausalitoThrive.org If you'd like to sign the petition, please DM me. I am around MLK park everyday and we need a real in person signature for this to happen!", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-25T14-40-30Z__post__new.png"}, {"comment_id": "comment_1610316226", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T03:18:57Z", "observed_at": "2026-05-26T03:19:59Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Albert ive spoken to several of them. Ther are nearly infinite stakeholders and I hope getting this initiative going will start those conversations for real. What I see from all of these conversations are businesses that are hampered, landlords that are frustrated or \"waiting it out\", and citizens that are equally frustrated and puzzled as to how some of our most beautiful land remains vacant while artists are clamoring for space on a handful of buildings.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-26T03-18-57Z__comment_1610316226__new.png"}, {"comment_id": "comment_1611052133", "author": "D", "klass": "new", "run_id": "2026-05-27T01:18:14Z", "observed_at": "2026-05-27T01:19:16Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "From today’s IJ: Sausalito Marinship rezoning supporters submit petition By Steven Rosenfeld UPDATED: May 26, 2026 at 3:38 PM PT  Supporters of a ballot initiative to remove decades-old obstacles to growth in Sausalito’s Marinship have submitted a petition to the city with more than 1,000 signatures. The measure seeks to revise Ordinance 1022, which voters approved in 1985 and blocks most new development in the 210-acre former World War II shipyard in the city’s north end. “We’ve made some pretty amazing progress on our AIM initiative petition,” Adrian Brinton, an organizer, said Tuesday. “We started circulating a week ago, Friday, and we basically gathered over 1,000 signatures in 10 days,” he said. “We just submitted our signed books to the city clerk this morning.” Seventeen unpaid volunteers gathered the petition signatures, said Sharna Brockett, another organizer. About 550 valid signatures – 10% of the city’s voters – are needed to qualify.  “Wow, that speaks volumes for them,” Mayor Steven Woodside said. “Assuming the signature count holds up and they meet the required percentage, it will go on the ballot.” The old shipyard has numerous sections. Its southern end is dominated by hulking boarded-up machine shops, lots filled with shipping containers, and run-down structures and vehicles. Closer to the shoreline, its mid-section contains working boatyards, marinas and artist studios. Other pockets have a handful of offices, restaurants and other businesses. Last November, voters rezoned several lots in its northern tier for state-mandated high-density housing. A developer has notified officials it seeks to build a 294-unit apartment complex on a 3-acre site. The ballot measure and its amendments are a 266-page document that proponents say would balance preservation and modernization.  “We have an artist community. We have industrial work. We have shipyards, boat-building. And we also have blighted areas,” Brinton said. “We also have areas that have been really lacking in investment for decades. And our codes and/or rules around what can get built are extremely restrictive and also put in by voter mandate.” “It really can’t be economically developed to add new workspaces, so we created the AIM initiative,” he said. During the past 20 years, numerous master planning efforts by city officials have languished due to local frictions and a lack of political will, Ray Withy, a former mayor and initiative supporter said. “It needs to be repealed because in planning sessions people start narrowing their thinking,” he said. “They suddenly say, oh we can’t do that because it’s against 1022, and so the whole debate gets narrowed.”  “The most important thing it does is return control back to the City Council,” Withy said. “It is really forcing the City Council to act.” Related Articles\n  • George Russell: Sausalito looks at updating Marinship area plan   • Sausalito pro-growth group pushes Marinship changes   • Sausalito gets proposal for nearly 300 apartments  “This is about breathing new life into our waterfront and investing in our industrial zones,” Brockett said. “When this passes, a lot of businesses down there will be able to regularly sell what they create, what they catch … it does not rezone for housing or hotels or anything like that.” Once petition signatures are verified and the measure qualifies, Woodside said the city attorney will write an impartial analysis and summary. “I urge everyone to stay tuned and pay close attention,” he said. “I urge people to look at the purposes of this initiative and try to understand them.” “Very little has happened over the last 40 years,” Woodside said. “I think that’s probably why a number of people in the community are interested in some level of change.”", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-27T01-18-14Z__comment_1611052133__new.png"}, {"comment_id": "comment_1611821272", "author": "Alex Yen", "klass": "new", "run_id": "2026-05-27T23:48:37Z", "observed_at": "2026-05-27T23:49:41Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Dunie I could not have said it better myself...truly. As a Sausalito waterfront business owner I'm horrified by the way the Marinship has been put into a deep freeze. It has gone the way of California land use politics writ large, where any sense of dynamism has been quashed in maintenance of a sclerotic status quo.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-27T23-48-37Z__comment_1611821272__new.png"}, {"comment_id": "comment_1611822027", "author": "Alex Yen", "klass": "new", "run_id": "2026-05-27T23:48:37Z", "observed_at": "2026-05-27T23:49:41Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Dunie Yes, yes and more yes. This is precisely it.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-27T23-48-37Z__comment_1611822027__new.png"}, {"comment_id": "comment_1611825543", "author": "Alex Yen", "klass": "new", "run_id": "2026-05-27T23:48:37Z", "observed_at": "2026-05-27T23:49:41Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron As a Sausalito waterfront business owner this is PRECISELY what I hear and see as well. The Marinship is broken. Bad land use policy has put it into a deep freeze.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-27T23-48-37Z__comment_1611825543__new.png"}, {"comment_id": "comment_1612114013", "author": "Michelle C.", "klass": "new", "run_id": "2026-05-28T08:48:09Z", "observed_at": "2026-05-28T08:49:05Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron , can you answer Albert’s first question? “Have you tried to lease industrial space from the landlords in charge of the areas that are being shown as underutilized?” It’s just a yes or no.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T08-48-09Z__comment_1612114013__new.png"}, {"comment_id": "comment_1603274786", "author": null, "klass": "deleted", "run_id": "2026-05-28T21:48:57Z", "observed_at": "2026-05-28T21:50:01Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1603390649", "author": null, "klass": "deleted", "run_id": "2026-05-28T21:48:57Z", "observed_at": "2026-05-28T21:50:01Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1603393996", "author": null, "klass": "deleted", "run_id": "2026-05-28T21:48:57Z", "observed_at": "2026-05-28T21:50:01Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1603477020", "author": null, "klass": "deleted", "run_id": "2026-05-28T21:48:57Z", "observed_at": "2026-05-28T21:50:01Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1603679883", "author": null, "klass": "deleted", "run_id": "2026-05-28T21:48:57Z", "observed_at": "2026-05-28T21:50:01Z", "is_reply": false, "p
