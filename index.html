2:19:59Z", "last_scrape_result": "ok", "totals": {"seen": 9, "live": 0, "edited": 0, "deleted": 9}, "post_body": "Setting the Record Straight on the AIM Initiative\n\nEmails and flyers are circulating in our community with serious factual errors about AIM. Sausalito deserves an honest conversation about our waterfront — not one built on misinformation designed to create fear, uncertainty, and doubt. Before you form an opinion, here's what's actually true:\n\nWhat AIM does NOT do:\n     Rezone for housing, hotels, or condominiums. Not permitted, period\n     Replace the 32-ft height limit everywhere. The 47-ft maximum applies only to the Industrial zone, and is still lower than the ICB building already on site\n     Hand unchecked power to City Council — it returns routine decisions to the same planning process every other California city uses, with public hearings and environmental review\n     Take away your voting power — Ordinance 1022 was decided by Sausalito voters forty years ago. AIM gives today's residents that same democratic opportunity: to decide for ourselves what our waterfront should be. \n\nWhat AIM DOES do:\n     Lets fishermen sell their catch, artists sell their work, bakers sell their bread. All currently prohibited under 40-year-old Ordinance 1022\n     Makes it economically viable to build real boat repair facilities, industrial workshops, and spaces for artists. Nothing viable has been built here in four decades\n     Addresses a root cause of blight: building rules so restrictive that investment is essentially impossible\n     Protects the existing uses at the historic Arques Shipyard and ICB against displacement.\n\nThe numbers the opposition isn't sharing:\n     Marinship generates $10K/acre in tax revenue vs. $70K/acre downtown\n     Industrial rents here top $3/sq ft — among the Bay Area's highest — because supply is artificially capped\n\nBefore making up your mind, we encourage you to visit sausalitothrive.org and learn more about the AIM Initiative. Our main website and detailed FAQ answers the most common questions. We've also posted a full point-by-point response to every claim circulating in the community at sausalitothrive.org/fact-vs-fiction . We just ask that you read it with an open mind. Questions? Reach us at info@sausalitothrive.org — we're happy to talk or hop on a zoom to to tell you more and answer your questions. Sausalito Waterfront AIM Initiative — Sign the Petition sausalitothrive.org", "comment_count": 9, "captures": [{"comment_id": "comment_1609071778", "author": "R", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:42:40Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Industrial rents would only rise", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-25T14-40-30Z__comment_1609071778__new.png"}, {"comment_id": "comment_1609082750", "author": "M", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at": "2026-05-25T14:42:40Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Thank you for setting the record straight so I can make up my own mind (without fear or misinformation) and hopefully get the chance to vote on this initiative in November. Given our political climate,  I welcome the opportunity to get LOCAL control back and return to routine decisions to the same planning process, with public hearings and environmental review. Everyone who wants our waterfront to thrive à la 21st century gets a seat at the table and collectively WE decide what we want to build in our community NOT what the state forces us to do! I still believe in the democratic process and AIM is that path forward 🙌🏻", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-25T14-40-30Z__comment_1609082750__new.png"}, {"comment_id": "comment_1609154011", "author": "R", "klass": "new", "run_id": "2026-05-25T14:40:30Z", "observed_at omment_id": "comment_1609389024", "author": "M", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:51:00Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Richard Correct, but what about measures K & J? Didn’t we learn anything??? I did! If you do nothing, then the state will tell you what to do so why not be proactive now (vs reactive) so we can return to local control and build what makes sense for our waterfront community.", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-26T18-48-54Z__comment_1609389024__new.png"}, {"comment_id": "comment_1609437516", "author": "R", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:51:00Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Michelle the waterfront is already under local control", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-26T18-48-54Z__comment_1609437516__new.png"}, {"comment_id": "comment_1609600319", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:51:00Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Richard false. The waterfront is under the control of no one. \"Vote of the people\" is a clever political hack to prevent any business before 1984 from doing anything. No bank will issue you financing, no investor can take that risk. The people who actually want to help businesses in the marinship want what's in this initiative.", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-26T18-48-54Z__comment_1609600319__new.png"}, {"comment_id": "comment_1610418352", "author": "Cris Welisch", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:51:00Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Thank you.", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-26T18-48-54Z__comment_1610418352__new.png"}, {"comment_id": "comment_1611051429", "author": "D", "klass": "new", "run_id": "2026-05-27T01:18:14Z", "observed_at": "2026-05-27T01:19:58Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "From today’s I J: Sausalito Marinship rezoning supporters submit petition By Steven Rosenfeld UPDATED: May 26, 2026 at 3:38 PM PT  Supporters of a ballot initiative to remove decades-old obstacles to growth in Sausalito’s Marinship have submitted a petition to the city with more than 1,000 signatures. The measure seeks to revise Ordinance 1022, which voters approved in 1985 and blocks most new development in the 210-acre former World War II shipyard in the city’s north end. “We’ve made some pretty amazing progress on our AIM initiative petition,” Adrian Brinton, an organizer, said Tuesday. “We started circulating a week ago, Friday, and we basically gathered over 1,000 signatures in 10 days,” he said. “We just submitted our signed books to the city clerk this morning.” Seventeen unpaid volunteers gathered the petition signatures, said Sharna Brockett, another organizer. About 550 valid signatures – 10% of the city’s voters – are needed to qualify.  “Wow, that speaks volumes for them,” Mayor Steven Woodside said. “Assuming the signature count holds up and they meet the required percentage, it will go on the ballot.” The old shipyard has numerous sections. Its southern end is dominated by hulking boarded-up machine shops, lots filled with shipping containers, and run-down structures and vehicles. Closer to the shoreline, its mid-section contains working boatyards, marinas and artist studios. Other pockets have a handful of offices, restaurants and other businesses. Last November, voters rezoned several lots in its northern tier for state-mandated high-density housing. A developer has notified officials it seeks to build a 294-unit apartment complex on a 3-acre site. The ballot measure and its amendments are a 266-page document that proponents say would balance preservation and modernization.  “We have an artist community. We have industrial work. We have shipyards, boat-building. And we also have blighted areas,” Brinton said. “We also have areas that have been really lacking in investment for decades. And our codes and/or rules around what can get built are extremely restrictive and also put in by voter mandate.” “It really can’t be economically developed to add new workspaces, so we created the AIM initiative,” he said. During the past 20 years, numerous master planning efforts by city officials have languished due to local frictions and a lack of political will, Ray Withy, a former mayor and initiative supporter said. “It needs to be repealed because in planning sessions people start narrowing their thinking,” he said. “They suddenly say, oh we can’t do that because it’s against 1022, and so the whole debate gets narrowed.”  “The most important thing it does is return control back to the City Council,” Withy said. “It is really forcing the City Council to act.” Related Articles\n  • George Russell: Sausalito looks at updating Marinship area plan   • Sausalito pro-growth group pushes Marinship changes   • Sausalito gets proposal for nearly 300 apartments  “This is about breathing new life into our waterfront and investing in our industrial zones,” Brockett said. “When this passes, a lot of businesses down there will be able to regularly sell what they create, what they catch … it does not rezone for housing or hotels or anything like that.” Once petition signatures are verified and the measure qualifies, Woodside said the city attorney will write an impartial analysis and summary. “I urge everyone to stay tuned and pay close attention,” he said. “I urge people to look at the purposes of this initiative and try to understand them.” “Very little has happened e in the democratic process and AIM is that path forward 🙌🏻", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T00-19-00Z__comment_1609082750__new.png"}, {"comment_id": "comment_1609154011", "author": "R", "klass": "new", "run_id": "2026-05-29T00:19:00Z", "observed_at": "2026-05-29T00:19:58Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Michelle The state has nothing to do with this initiative", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T00-19-00Z__comment_1609154011__new.png"}, {"comment_id": "comment_1609292135", "author": "J", "klass": "new", "run_id": "2026-05-29T00:19:00Z", "observed_at": "2026-05-29T00:19:58Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Thank you. And it let’s us , the voters, decide.", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T00-19-00Z__comment_1609292135__new.png"}, {"comment_id": "comment_1609389024", "author": "M", "klass": "new", "run_id": "2026-05-29T00:19:00Z", "observed_at": "2026-05-29T00:19:58Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Richard Correct, but what about measures K & J? Didn’t we learn anything??? I did! If you do nothing, then the state will tell you what to do so why not be proactive now (vs reactive) so we can return to local control and build what makes sense for our waterfront community.", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T00-19-00Z__comment_1609389024__new.png"}, {"comment_id": "comment_1609437516", "author": "R", "klass": "new", "run_id": "2026-05-29T00:19:00Z", "observed_at": "2026-05-29T00:19:58Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Michelle the waterfront is already under local control", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T00-19-00Z__comment_1609437516__new.png"}, {"comment_id": "comment_1609600319", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-29T00:19:00Z", "observed_at": "2026-05-29T00:19:58Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Richard false. The waterfront is under the control of no one. \"Vote of the people\" is a clever political hack to prevent any business before 1984 from doing anything. No bank will issue you financing, no investor can take that risk. The people who actually want to help businesses in the marinship want what's in this initiative.", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T00-19-00Z__comment_1609600319__new.png"}, {"comment_id": "comment_1610418352", "author": "Cris Welisch", "klass": "new", "run_id": "2026-05-29T00:19:00Z", "observed_at": "2026-05-29T00:19:58Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Thank you.", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T00-19-00Z__comment_1610418352__new.png"}, {"comment_id": "comment_1611051429", "author": "D", "klass": "new", "run_id": "2026-05-29T00:19:00Z", "observed_at": "2026-05-29T00:19:58Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "From today’s I J: Sausalito Marinship rezoning supporters submit petition By Steven Rosenfeld UPDATED: May 26, 2026 at 3:38 PM PT  Supporters of a ballot initiative to remove decades-old obstacles to growth in Sausalito’s Marinship have submitted a petition to the city with more than 1,000 signatures. The measure seeks to revise Ordinance 1022, which voters approved in 1985 and blocks most new development in the 210-acre former World War II shipyard in the city’s north end. “We’ve made some pretty amazing progress on our AIM initiative petition,” Adrian Brinton, an organizer, said Tuesday. “We started circulating a week ago, Friday, and we basically gathered over 1,000 signatures in 10 days,” he said. “We just submitted our signed books to the city clerk this morning.” Seventeen unpaid volunteers gathered the petition signatures, said Sharna Brockett, another organizer. About 550 valid signatures – 10% of the city’s voters – are needed to qualify.  “Wow, that speaks volumes for them,” Mayor Steven Woodside said. “Assuming the signature count holds up and they meet the required percentage, it will go on the ballot.” The old shipyard has numerous sections. Its southern end is dominated by hulking boarded-up machine shops, lots filled with shipping containers, and run-down structures and vehicles. Closer to the shoreline, its mid-section contains working boatyards, marinas and artist studios. Other pockets have a handful of offices, restaurants and other businesses. Last November, voters rezoned several lots in its northern tier for state-mandated high-density housing. A developer has notified officials it seeks to build a 294-unit apartment complex on a 3-acre site. The ballot measure and its amendments are a 266-page document that proponents say would balance preservation and modernization.  “We have an artist community. We have industrial work. We have shipyards, boat-building. And we also have blighted areas,” Brinton said. “We also have areas that have been really lacking in investment for decades. And our codes and/or rules around what can get built are extremely restrictive and also put in by voter mandate.” “It really can’t be economically developed to add new workspaces, so we created the AIM initiative,” he said. During the past 20 years, numerous master planning efforts by city officials have languished due to local frictions and a lack of political will, Ray Withy, a former mayor and initiative supporter said. “It needs to be repealed because in planning sessions people start narrowing their thinking,” he said. “They suddenly say, oh we can’t do that because it’s against 1022, and so the whole debate gets narrowed.”  “The most important thing it does is return control back to the City Council,” Withy said. “It is really forcing the City Council to act.” Related Articles\n  • George Russell: Sausalito looks at updating Marinship area plan   • Sausalito pro-growth group pushes Marinship changes   • Sausalito gets proposal for nearly 300 apartments  “This is about breathing new life into our waterfront and investing in our industrial zones,” Brockett said. “When this passes, a lot of businesses down there will be able to regularly sell what they create, what they catch … it does not rezone for housing or hotels or anything like that.” Once petition signatures are verified and the measure qualifies, Woodside said the city attorney will write an impartial analysis and summary. “I urge everyone to stay tuned and pay close attention,” he said. “I urge people to look at the purposes of this initiative and try to understand them.” “Very little has happened over the last 40 years,” Woodside said. “I think that’s probably why a number of people in the community are interested in some level of change.”", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T00-19-00Z__comment_1611051429__new.png"}, {"comment_id": "comment_1609071778", "author": null, "klass": "deleted", "run_id": "2026-05-29T04:48:42Z", "observed_at": "2026-05-29T04:49:53Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1609082750", "author": null, "klass": "deleted", "run_id": "2026-05-29T04:48:42Z", "observed_at": "2026-05-29T04:49:53Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1609154011", "author": null, "klass": "deleted", "run_id": "2026-05-29T04:48:42Z", "observed_at": "2026-05-29T04:49:53Z", "is_reply": false, "parent_comment_id": null, "t uild a 294-unit apartment complex on a 3-acre site. The ballot measure and its amendments are a 266-page document that proponents say would balance preservation and modernization.  “We have an artist community. We have industrial work. We have shipyards, boat-building. And we also have blighted areas,” Brinton said. “We also have areas that have been really lacking in investment for decades. And our codes and/or rules around what can get built are extremely restrictive and also put in by voter mandate.” “It really can’t be economically developed to add new workspaces, so we created the AIM initiative,” he said. During the past 20 years, numerous master planning efforts by city officials have languished due to local frictions and a lack of political will, Ray Withy, a former mayor and initiative supporter said. “It needs to be repealed because in planning sessions people start narrowing their thinking,” he said. “They suddenly say, oh we can’t do that because it’s against 1022, and so the whole debate gets narrowed.”  “The most important thing it does is return control back to the City Council,” Withy said. “It is really forcing the City Council to act.” Related Articles\n  • George Russell: Sausalito looks at updating Marinship area plan   • Sausalito pro-growth group pushes Marinship changes   • Sausalito gets proposal for nearly 300 apartments  “This is about breathing new life into our waterfront and investing in our industrial zones,” Brockett said. “When this passes, a lot of businesses down there will be able to regularly sell what they create, what they catch … it does not rezone for housing or hotels or anything like that.” Once petition signatures are verified and the measure qualifies, Woodside said the city attorney will write an impartial analysis and summary. “I urge everyone to stay tuned and pay close attention,” he said. “I urge people to look at the purposes of this initiative and try to understand them.” “Very little has happened over the last 40 years,” Woodside said. “I think that’s probably why a number of people in the community are interested in some level of change.”", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T05-18-32Z__comment_1611051429__new.png"}, {"comment_id": "comment_1609071778", "author": null, "klass": "deleted", "run_id": "2026-05-29T07:18:13Z", "observed_at": "2026-05-29T07:19:13Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1609082750", "author": null, "klass": "deleted", "run_id": "2026-05-29T07:18:13Z", "observed_at": "2026-05-29T07:19:13Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1609154011", "author": null, "klass": "deleted", "run_id": "2026-05-29T07:18:13Z", "observed_at": "2026-05-29T07:19:13Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1609292135", "author": null, "klass": "deleted", "run_id": "2026-05-29T07:18:13Z", "observed_at": "2026-05-29T07:19:13Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1609389024", "author": null, "klass": "deleted", "run_id": "2026-05-29T07:18:13Z", "observed_at": "2026-05-29T07:19:13Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1609437516", "author": null, "klass": "deleted", "run_id": "2026-05-29T07:18:13Z", "observed_at": "2026-05-29T07:19:13Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1609600319", "author": null, "klass": "deleted", "run_id": "2026-05-29T07:18:13Z", "observed_at": "2026-05-29T07:19:13Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610418352", "author": null, "klass": "deleted", "run_id": "2026-05-29T07:18:13Z", "observed_at": "2026-05-29T07:19:13Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1611051429", "author": null, "klass": "deleted", "run_id": "2026-05-29T07:18:13Z", "observed_at": "2026-05-29T07:19:13Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1609071778", "author": "R", "klass": "new", "run_id": "2026-05-29T07:48:55Z", "observed_at": "2026-05-29T07:51:09Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Industrial rents would only rise", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T07-48-55Z__comment_1609071778__new.png"}, {"comment_id": "comment_1609082750", "author": "M", "klass": "new", "run_id": "2026-05-29T07:48:55Z", "observed_at": "2026-05-29T07:51:09Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Thank you for setting the record straight so I can make up my own mind (without fear or misinformation) and hopefully get the chance to vote on this initiative in November. Given our political climate,  I welcome the opportunity to get LOCAL control back and return to routine decisions to the same planning process, with public hearings and environmental review. Everyone who wants our waterfront to thrive à la 21st century gets a seat at the table and collectively WE decide what we want to build in our community NOT what the state forces us to do! I still believe in the democratic process and AIM is that path forward 🙌🏻", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T07-48-55Z__comment_1609082750__new.png"}, {"comment_id": "comment_1609154011", "author": "R", "klass": "new", "run_id": "2026-05-29T07:48:55Z", "observed_at": "2026-05-29T07:51:09Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Michelle The state has nothing to do with this initiative", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T07-48-55Z__comment_1609154011__new.png"}, {"comment_id": "comment_1609292135", "author": "J", "klass": "new", "run_id": "2026-05-29T07:48:55Z", "observed_at": "2026-05-29T07:51:09Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Thank you. And it let’s us , the voters, decide.", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T07-48-55Z__comment_1609292135__new.png"}, {"comment_id": "comment_1609389024", "author": "M", "klass": "new", "run_id": "2026-05-29T07:48:55Z", "observed_at": "2026-05-29T07:51:09Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Richard Correct, but what about measures K & J? Didn’t we learn anything??? I did! If you do nothing, then the state will tell you what to do so why not be proactive now (vs reactive) so we can return to local control and build what makes sense for our waterfront community.", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T07-48-55Z__comment_1609389024__new.png"}, {"comment_id": "comment_1609437516", "author": "R", "klass": "new", "run_id": "2026-05-29T07:48:55Z", "observed_at": "2026-05-29T07:51:09Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Michelle the waterfront is already under local control", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T07-48-55Z__comment_1609437516__new.png"}, {"comment_id": "comment_1609600319", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-29T07:48:55Z", "observed_at": "2026-05-29T07:51:09Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Richard false. The waterfront is under the control of no one. \"Vote of the people\" is a clever political hack to prevent any business before 1984 from doing anything. No bank will issue you financing, no investor can take that risk. The people who actually want to help businesses in the marinship want what's in this initiative.", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T07-48-55Z__comment_1609600319__new.png"}, {"comment_id": "comment_1610418352", "author": "Cris Welisch", "klass": "new", "run_id": "2026-05-29T07:48:55Z", "observed_at": "2026-05-29T07:51:09Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Thank you.", "screenshot": "data/posts/p_FsYPWd4SGL4M/captures/2026-05-29T07-48-55Z__comment_1610418352__new.png"}, {"comment_id": "comment_1611051429", "author": "D", "klass": "new", "run_id": "2026-05-29T07:48:55Z", "observed_at": "2026-05-29T07:51:09Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "From today’s I J: Sausalito Marinship rezoning supporters submit petition By Steven Rosenfeld UPDATED: May 26, 2026 at 3:38 PM PT  Supporters of a ballot initiative to remove decades-old obstacles to growth in Sausalito’s Marinship have submitted a petition to the city with more than 1,000 signatures. The measure seeks to revise Ordinance 1022, which voters approved in 1985 and blocks most new development in the 210-acre former World War II shipyard in the city’s north end. “We’ve made some pretty amazing progress on our AIM initiative petition,” Adrian Brinton, an organizer, said Tuesday. “We started circulating a week ago, Friday, and we ba
