ited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610316226", "author": null, "klass": "deleted", "run_id": "2026-05-28T21:48:57Z", "observed_at": "2026-05-28T21:50:01Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1611052133", "author": null, "klass": "deleted", "run_id": "2026-05-28T21:48:57Z", "observed_at": "2026-05-28T21:50:01Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1611821272", "author": null, "klass": "deleted", "run_id": "2026-05-28T21:48:57Z", "observed_at": "2026-05-28T21:50:01Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1611822027", "author": null, "klass": "deleted", "run_id": "2026-05-28T21:48:57Z", "observed_at": "2026-05-28T21:50:01Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1611825543", "author": null, "klass": "deleted", "run_id": "2026-05-28T21:48:57Z", "observed_at": "2026-05-28T21:50:01Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1612114013", "author": null, "klass": "deleted", "run_id": "2026-05-28T21:48:57Z", "observed_at": "2026-05-28T21:50:01Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1603274786", "author": "Dana Herrick", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "✅", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1603274786__new.png"}, {"comment_id": "comment_1603390649", "author": "J", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Sign me up! Thank you Aaron, Michelle and Adrian for all of your work on this. Tying future development to job creation and critical infrastructure needs is smart growth that will benefit all of Sausalito.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1603390649__new.png"}, {"comment_id": "comment_1603393996", "author": "R", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "I’ve signed the petition. The proposal makes so much sense for enhancing the waterfront and increasing tax revenue for Sausalito. Thanks Aaron for posting.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1603393996__new.png"}, {"comment_id": "comment_1603477020", "author": "J", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "I have signed the petition.   Let’s get this on the November ballot and pass it!  Sausalito needs Marinship to THRIVE!", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1603477020__new.png"}, {"comment_id": "comment_1603679883", "author": "Natasha D.", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "I love this idea and have already signed a petition! Let’s get this on the ballot.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1603679883__new.png"}, {"comment_id": "comment_1604457576", "author": "V", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "It's a scam it'll hurt all the industrial businesses and the membership do not sign it look into it further and you will see", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1604457576__new.png"}, {"comment_id": "comment_1604492672", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Please do look into it! We want an informed electorate, not i driven by fear, uncertainty and doubt. Unless you think all of Sausalito is a scam, it's hard to see how this is.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1604492672__new.png"}, {"comment_id": "comment_1604576043", "author": "D", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Vincent how will it hurt the businesses? Please give some examples. It’s my perspective that will only help grow businesses. I’ve lived here almost 60 years and I’m horrified by the state of the waterfront. I look forward to making it a viable place of commerce for local businesses and residents. I’d like to have another sort of downtown area where as a local that I can go and hang out in - to start…more restaurants - more parks - bike trail - community center with a pool. I’d like to have something like a Sam’s in this area of town. Please share why this is a bad idea? It makes no sense to me whatsoever why one would think this is a bad idea. I understand the fear of losing the “waterfront community” to gentrification, but don’t we want a nice clean place to live and play and use every day? We have to think in future terms. What do we want Sausalito to look like in five years, 10 years, 20 years. Do we want to keep our children in town with hopes opening up their own businesses for profit? Yes we do. Do we really want this bulk of land to look like a homeless encampment for the next 20 years. What does that say about Sausalito? The idea is mortifying to me and I just won’t stand for it in my backyard.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1604576043__new.png"}, {"comment_id": "comment_1605165966", "author": "Ginny Erwin", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Sounds like a wolf in sheep’s clothing. \nKeep the waterfront as is and work with what you have now. \nTake a look at the B of A art center. How many local artists are there? How popular is it for locals and tourists? \n\nWe need to keep the soul of our quiet waterfront intact. Don’t make this into something that will ruin the culture and beauty of what Sausalito currently has.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1605165966__new.png"}, {"comment_id": "comment_1605168887", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Ginny it's a shame younl dont want more artists and industrial users, and prefer vacant lots and rv storage. For me, only the first thing makes Sausalito special, not the second", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1605168887__new.png"}, {"comment_id": "comment_1605292709", "author": "D", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Ginny Yes, we absolutely need to keep the soul of Sausalito. Consider Sausalito in its entirety as your gated backyard. Would you rather have your yard overgrown with weeds and broken glass bottles, and perhaps dead animals  hidden somewhere under a broken down shed or would you like to have somebody else come in and pay to remodel your entire backyard replacing the shed with a tiny guest room or ADU or private art studio and plant roses and Lillie’s and jasmine to scent your property year round, even give you a hot tub? If all this will cost you pennies on the dollar,  would you consider it? Consider for a second of fixing up the waterfront area as fixing up your own property. In this respect, you’ll be able to have a lot of friends over shoeless and you won’t be embarrassed or fearful of injury or coming upon uninvited “guests” sleeping it off in your rose bushes. You’ll be able to entertain and throw birthday parties for your kids or your parents and do it all with your head held high, and pass your pride of ownership to your children and their children for as long as Sausalito exists.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1605292709__new.png"}, {"comment_id": "comment_1605696722", "author": "Simon W Snellgrove", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "The Federal government is about to issue an army Corps of Engineers report on Sea Level Rise. (SLR) Legislation is already drafted that would provide nationwide funding of approximately $55 Billion in funding for SLR of which California is likely to receive $36B. The Port of San Francisco is all over this and has available a lot of information available. I very much doubt that the AIM initiative would help - in fact, it is likely to be a drop in the bucket and, in fact, jeopardize Sausalito’s ability to benefit from the Fed/State funding.. Please do your homework before endorsing this initiative. Thanks", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1605696722__new.png"}, {"comment_id": "comment_1605697450", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Simon W yup and I did. Eligibility for the federal programs is enhanced by having credible plans for development and investment while maintaining the working waterfront. But if we do nothing, we'll be lacking the funds and pan to be \"all over\" the federal grants.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1605697450__new.png"}, {"comment_id": "comment_1605989847", "author": "Lisy Ruiz", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Dunie I love your idea for a public pool! I live in the marinship and hope to start a family here … yet, i can’t think of anywhere close by that i could teach kiddos how to swim 😅", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1605989847__new.png"}, {"comment_id": "comment_1606341554", "author": "Albert Strietmann", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Hi Aaron this initiative is being brought to the city council by a small group of business owners who really only have their own interests in mind. I don’t support AIM initiative because it would remove our ability to vote on important matters and place all the control directly in the lap of a handful of city council members. I hope you take a closer look at what’s being proposed and by whom.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1606341554__new.png"}, {"comment_id": "comment_1606347966", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Albert it's funny you say that. I am one of the authors of the proposed measure and I am not a land owner in the marinship nor a business owner there. I am a parent of two who lives on Coloma St and a concerned citizen looking to make our waterfront thrive.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1606347966__new.png"}, {"comment_id": "comment_1606366083", "author": "Albert Strietmann", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron oh interesting, you should consider getting to know some of the folks who are actively working on the waterfront. Many are multigenerational family owned businesses that support our other neighbors such as the floating home community and the many other working vessels in Sausalito. \n\nIt’s funny to imagine a thriving working waterfront without industrial protections…", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1606366083__new.png"}, {"comment_id": "comment_1606370912", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Albert happy to do more. I have actually met several folks while gathering signatures from marine carpenters to people building robots on the waterfront. No one wants to displace these important businesses and AIM wont do that. What almost everyone does want is to turn the underutilized land into more studios and workshops. They do want to address the infrastructure shortfalls without increasing taxes. This is that path.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1606370912__new.png"}, {"comment_id": "comment_1606395592", "author": "Albert Strietmann", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron have you tried to lease industrial space from the landlords that are in charge of the areas that are being shown as underutilized? Have you seen the work that is done is the current space? I’m not sure if you understand why the different yards appear the way they do today. KKMI just sold to a larger group, it’s totally profitable. Clipper has hosted many successful events. Just try to consider maybe your friends in these groups aren’t being honest with you about the topic. It will take more than a couple years to meet people and understand the dynamic between property owner, business owner and culture that we grew up in", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1606395592__new.png"}, {"comment_id": "comment_1610316226", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Albert ive spoken to several of them. Ther are nearly infinite stakeholders and I hope getting this initiative going will start those conversations for real. What I see from all of these conversations are businesses that are hampered, landlords that are frustrated or \"waiting it out\", and citizens that are equally frustrated and puzzled as to how some of our most beautiful land remains vacant while artists are clamoring for space on a handful of buildings.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1610316226__new.png"}, {"comment_id": "comment_1611052133", "author": "D", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "From today’s IJ: Sausalito Marinship rezoning supporters submit petition By Steven Rosenfeld UPDATED: May 26, 2026 at 3:38 PM PT  Supporters of a ballot initiative to remove decades-old obstacles to growth in Sausalito’s Marinship have submitted a petition to the city with more than 1,000 signatures. The measure seeks to revise Ordinance 1022, which voters approved in 1985 and blocks most new development in the 210-acre former World War II shipyard in the city’s north end. “We’ve made some pretty amazing progress on our AIM initiative petition,” Adrian Brinton, an organizer, said Tuesday. “We started circulating a week ago, Friday, and we basically gathered over 1,000 signatures in 10 days,” he said. “We just submitted our signed books to the city clerk this morning.” Seventeen unpaid volunteers gathered the petition signatures, said Sharna Brockett, another organizer. About 550 valid signatures – 10% of the city’s voters – are needed to qualify.  “Wow, that speaks volumes for them,” Mayor Steven Woodside said. “Assuming the signature count holds up and they meet the required percentage, it will go on the ballot.” The old shipyard has numerous sections. Its southern end is dominated by hulking boarded-up machine shops, lots filled with shipping containers, and run-down structures and vehicles. Closer to the shoreline, its mid-section contains working boatyards, marinas and artist studios. Other pockets have a handful of offices, restaurants and other businesses. Last November, voters rezoned several lots in its northern tier for state-mandated high-density housing. A developer has notified officials it seeks to build a 294-unit apartment complex on a 3-acre site. The ballot measure and its amendments are a 266-page document that proponents say would balance preservation and modernization.  “We have an artist community. We have industrial work. We have shipyards, boat-building. And we also have blighted areas,” Brinton said. “We also have areas that have been really lacking in investment for decades. And our codes and/or rules around what can get built are extremely restrictive and also put in by voter mandate.” “It really can’t be economically developed to add new workspaces, so we created the AIM initiative,” he said. During the past 20 years, numerous master planning efforts by city officials have languished due to local frictions and a lack of political will, Ray Withy, a former mayor and initiative supporter said. “It needs to be repealed because in planning sessions people start narrowing their thinking,” he said. “They suddenly say, oh we can’t do that because it’s against 1022, and so the whole debate gets narrowed.”  “The most important thing it does is return control back to the City Council,” Withy said. “It is really forcing the City Council to act.” Related Articles\n  • George Russell: Sausalito looks at updating Marinship area plan   • Sausalito pro-growth group pushes Marinship changes   • Sausalito gets proposal for nearly 300 apartments  “This is about breathing new life into our waterfront and investing in our industrial zones,” Brockett said. “When this passes, a lot of businesses down there will be able to regularly sell what they create, what they catch … it does not rezone for housing or hotels or anything like that.” Once petition signatures are verified and the measure qualifies, Woodside said the city attorney will write an impartial analysis and summary. “I urge everyone to stay tuned and pay close attention,” he said. “I urge people to look at the purposes of this initiative and try to understand them.” “Very little has happened over the last 40 years,” Woodside said. “I think that’s probably why a number of people in the community are interested in some level of change.”", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1611052133__new.png"}, {"comment_id": "comment_1611821272", "author": "Alex Yen", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Dunie I could not have said it better myself...truly. As a Sausalito waterfront business owner I'm horrified by the way the Marinship has been put into a deep freeze. It has gone the way of California land use politics writ large, where any sense of dynamism has been quashed in maintenance of a sclerotic status quo.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1611821272__new.png"}, {"comment_id": "comment_1611822027", "author": "Alex Yen", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Dunie Yes, yes and more yes. This is precisely it.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1611822027__new.png"}, {"comment_id": "comment_1611825543", "author": "Alex Yen", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron As a Sausalito waterfront business owner this is PRECISELY what I hear and see as well. The Marinship is broken. Bad land use policy has put it into a deep freeze.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1611825543__new.png"}, {"comment_id": "comment_1612114013", "author": "Michelle C.", "klass": "new", "run_id": "2026-05-28T23:48:46Z", "observed_at": "2026-05-28T23:49:48Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron , can you answer Albert’s first question? “Have you tried to lease industrial space from the landlords in charge of the areas that are being shown as underutilized?” It’s just a yes or no.", "screenshot": "data/posts/p_pg2PjB_kYccZ/captures/2026-05-28T23-48-46Z__comment_1612114013__new.png"}, {"comment_id": "comment_1603274786", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1603390649", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1603393996", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1603477020", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1603679883", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48: -05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1605697450", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1605989847", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1606341554", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1606347966", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1606366083", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1606370912", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1606395592", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610316226", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1611052133", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1611821272", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1611822027", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1611825543", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1612114013", "author": null, "klass": "deleted", "run_id": "2026-05-29T00:48:57Z", "observed_at": "2026-05-29T00:49:54Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}]}]};
const filters = { new: true, edited: true, deleted: true };
const sel = document.getElementById('postsel');
const main = document.getElementById('main');
const lb = document.getElementById('lb');

function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmt(ts){ if(!ts) return '—'; return ts.replace('T',' ').replace('Z',' UTC'); }

function postLabel(p){
  let title = '';
  if (p.post_body) title = p.post_body.split('\n')[0].slice(0, 70);
  else if (p.url) title = p.url.replace(/^https?:\/\/(www\.)?/,'');
  const t = p.totals || {};
  return `${title || p.slug}  ·  ${p.captures.length} captures` +
         (t.edited ? `, ${t.edited} edited` : '') +
         (t.deleted ? `, ${t.deleted} deleted` : '');
}

DATA.posts.forEach((p,i)=>{
  const o = document.createElement('option');
  o.value = i; o.textContent = postLabel(p);
  sel.appendChild(o);
});

function captureCard(c){
  const cls = c.klass || 'new';
  const shot = c.screenshot
    ? `<img class="shot" src="${esc(c.screenshot)}" alt="screenshot" loading="lazy">`
    : `<div class="noshot">no screenshot</div>`;
  return `<div class="card${c.is_reply?' reply':''}">
    <div>${shot}</div>
    <div>
      <div class="meta">
        <span class="tag ${cls}">${esc(cls)}</span>
        <span class="author">${esc(c.author || 'unknown')}</span>
        <span>· ${esc(fmt(c.observed_at))}</span>
        ${c.timestamp_text?`<span>· posted ${esc(c.timestamp_text)}</span>`:''}
        ${c.is_reply?'<span>· reply</span>':''}
        <span>· ${esc(c.comment_id||'')}</span>
      </div>
      <div class="body${cls==='deleted'?' deleted':''}">${esc(c.body_text) || '<em>(no text)</em>'}</div>
    </div>
  </div>`;
}

function render(){
  const p = DATA.posts[+sel.value];
  if(!p){ main.innerHTML = '<div class="empty">No posts captured yet.</div>'; return; }
  const t = p.totals || {};
  let html = `<div class="postmeta">
    ${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a>`:esc(p.slug)}
    <div class="badges">
      <span class="badge">slug: ${esc(p.slug)}</span>
      <span class="badge">first seen: ${esc(fmt(p.first_seen_at))}</span>
      <span class="badge">last scrape: ${esc(fmt(p.last_scrape_at))} (${esc(p.last_scrape_result||'?')})</span>
      <span class="badge">comments live: ${t.live??'—'}/${t.seen??'—'}</span>
      <span class="badge">edited ever: ${t.edited??0}</span>
      <span class="badge">deleted ever: ${t.deleted??0}</span>
    </div>
    ${p.post_body?`<div class="postbody">${esc(p.post_body)}</div>`:''}
  </div>`;

  // Group captures by comment, ordered by first observation; events within a
  // comment shown chronologically so an edit/delete reads as a history.
  const order = [];
  const byComment = new Map();
  for (const c of p.captures){
    if (!filters[c.klass || 'new']) continue;
    const k = c.comment_id || c.run_id;
    if (!byComment.has(k)){ byComment.set(k, []); order.push(k); }
    byComment.get(k).push(c);
  }

  if (!order.length){
    html += '<div class="empty">No captures match the current filters.</div>';
  } else {
    for (const k of order){
      const events = byComment.get(k).sort((a,b)=>(a.observed_at||'').localeCompare(b.observed_at||''));
      html += `<div class="group"><h3>${esc(k)} · ${events.length} capture${events.length>1?'s':''}</h3>`;
      html += events.map(captureCard).join('');
      html += `</div>`;
    }
  }
  main.innerHTML = html;
}

sel.addEventListener('change', render);
document.querySelectorAll('.filterbtn').forEach(b=>{
  b.addEventListener('click', ()=>{
    const k = b.dataset.k; filters[k] = !filters[k];
    b.classList.toggle('off', !filters[k]); render();
  });
});
main.addEventListener('click', e=>{
  if (e.target.classList.contains('shot')){
    lb.querySelector('img').src = e.target.src; lb.style.display = 'flex';
  }
});
lb.addEventListener('click', ()=>{ lb.style.display='none'; lb.querySelector('img').src=''; });

render();
</script>
</body>
</html>
