262353", "author": null, "klass": "deleted", "run_id": "2026-05-26T17:18:30Z", "observed_at": "2026-05-26T17:18:37Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610274351", "author": null, "klass": "deleted", "run_id": "2026-05-26T17:18:30Z", "observed_at": "2026-05-26T17:18:37Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610278015", "author": null, "klass": "deleted", "run_id": "2026-05-26T17:18:30Z", "observed_at": "2026-05-26T17:18:37Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610279254", "author": null, "klass": "deleted", "run_id": "2026-05-26T17:18:30Z", "observed_at": "2026-05-26T17:18:37Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610281342", "author": null, "klass": "deleted", "run_id": "2026-05-26T17:18:30Z", "observed_at": "2026-05-26T17:18:37Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610293272", "author": null, "klass": "deleted", "run_id": "2026-05-26T17:18:30Z", "observed_at": "2026-05-26T17:18:37Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610309584", "author": null, "klass": "deleted", "run_id": "2026-05-26T17:18:30Z", "observed_at": "2026-05-26T17:18:37Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610373284", "author": null, "klass": "deleted", "run_id": "2026-05-26T17:18:30Z", "observed_at": "2026-05-26T17:18:37Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610375140", "author": null, "klass": "deleted", "run_id": "2026-05-26T17:18:30Z", "observed_at": "2026-05-26T17:18:37Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610382798", "author": null, "klass": "deleted", "run_id": "2026-05-26T17:18:30Z", "observed_at": "2026-05-26T17:18:37Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610396624", "author": null, "klass": "deleted", "run_id": "2026-05-26T17:18:30Z", "observed_at": "2026-05-26T17:18:37Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610398615", "author": null, "klass": "deleted", "run_id": "2026-05-26T17:18:30Z", "observed_at": "2026-05-26T17:18:37Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610518996", "author": null, "klass": "deleted", "run_id": "2026-05-26T17:18:30Z", "observed_at": "2026-05-26T17:18:37Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1610542970", "author": null, "klass": "deleted", "run_id": "2026-05-26T17:18:30Z", "observed_at": "2026-05-26T17:18:37Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1603996649", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "the basic laws of supply and demand disagree, when you increase supply you drive down prices. \n\nRegardless, I agree we do NOT want to displace artists and local businesses and it's worth putting out the AIM initiative does neither. \n\nIf you remember last year, we ended up passing measure K which will displace many artists and builders, and that is a direct result of this outdated law tying our hands behinds our back. Let's be smart, have a dialog and we have till November to vote on this and hopefully both preserve the things that make Sausalito amazing and improve the utilization of idle land and create tax revenues in doing so.", "screenshot": null}, {"comment_id": "comment_1604006478", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "I also have to say, the documentary is absolutely beautiful. It highlights all the things we want to not just preserve, but encourage more of. I'm in high tech robotics, having companies build maritime machines is amazing. We can do so much if we actually just let the marinship thrive.", "screenshot": null}, {"comment_id": "comment_1604042089", "author": "L", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey makes a very valid point.  Artistic communities gather in affordable places, create an attractive vibe. Under the guise of improvement and yet more development, rents in existing spaces will rise to match the new/higher rental fees, pushing out the creative folks, and ruining the charm. These people belong here.  Landlords/developers are supporting this measure", "screenshot": null}, {"comment_id": "comment_1604141375", "author": "M", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lynn Ruining the charm? Hmmm I’ve lived here 10yrs, not a landlord or a developer,  just wondering why parts of the Marinship have been left to deteriorate - not a charming look if you ask me or the confused tourists 🤔 The Waterfront is for everyone and this time a group of well intentioned local residents from 2026 (not 1985) support this initiative because 40yrs is enough! I don’t want our gem of a town to become an expensive fossil. How are we going to pay for millions of dollars of infrastructure repair? Higher property taxes? NO THANKS I’ve paid enough and I still can’t get a cup of coffee at a local cafe or open up a business in Marinship to serve my community.  I moved here from SF so I don’t want Fisherman’s Wharf either. I want to give people the option to vote on this AIM initiative in November and have real dialogue. Tired of the outdated narratives rooted in fear - let the people of 2026 decide because we’re LIVING in the 21st century and hope to be here for another 10yrs 🙏", "screenshot": null}, {"comment_id": "comment_1604264835", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron thank you for your thoughtful reply.  While the basic laws of supply and demand usually work that way, in this small, wealthy town, I'm curious if that would really work this way.  Yes, I see people supporting small business here and naturally I would be all for it but not at the cost of what will truly happen.  Trust me,  I moved here 11 years ago and was like \"what the hell is going on down here?\"   Why have these property owners let dilapidation happen?   Then I started asking more of the people who work and live here. The owners have no need to improve their properties of light industrial.  Why would they as when the zoning would change, they are set to make top dollar to the highest bidder (developer) Do you think these property owners do not have the funds to take care of their properties? I think you know that they do. Some are attorneys, some don't live in the state, they don't feel they need to until it will benefit them.  Supply and demand sure does work in their favor.  It's not being scared of change.  Measure K HAD to pass as like Ian Sobieski said at the time.  We could not risk Builders Remedy coming in from the state.  He was reluctant but knew that he had to encourage it.  From what I know down here, both sides are not talking.  Were you at the city council meeting about 4 years ago when Ian suggested a \"blue ribbon\" meeting for all sides to talk.  Did that happen?  No.", "screenshot": null}, {"comment_id": "comment_1604271279", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "A new group was formed to block-out that side.  Were they invited to join?   As far as I know, it was only me.  And, yes, I want a cumbia because that is my natural personality. I want to see and believe this would work.  Just look at our touristy area.  T-shirts and chachkies.  I'm hoping that this thread can be civil and not become contentious as you do as well.  And robotics is really interesting!  Are you considering having a space in the Marinship.  There are a lot of empty commercial spaces in buildings that were NOT suppose to be allowed in the area zoned \"I\"   I wonder how that happened in the 80s?   Maybe the long-time folks will chime in to explain.", "screenshot": null}, {"comment_id": "comment_1604272283", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lynn thank you for your comment.  I've been through it for 35 years in various cities and have worked in architecture, development, and design.  It works this way, as often the most money wins.  At least I did get a hefty fee to leave my rent-controlled space in New York City.", "screenshot": null}, {"comment_id": "comment_1604282328", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Michelle I don't think I used the word \"charm\" as getting dust in my mouth when a car drives by in the shipyards.  But it's a shipyard.  I do and want to believe it's well-intended, not fear of outdated narrative.  But realistically, I know how this goes from my history. We made our numbers for the state and planned housing is coming.  Can someone here give me a cost of what a studio or 1-Br will be?  I would love to know.  Do you think a coffee will not be $6.00 if new places open? What do you think rents will be for small owners trying to open here? We are going to be here another 100 + years.  That's why all working towards climate change and our sinking landfill are proposing a lot of ideas.  I get it. It is very complicated. The last meeting at the Bay Model was very informative for all.", "screenshot": null}, {"comment_id": "comment_1604337868", "author": "M", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey I was at that city council meeting and I remember Ian's comment and you are correct, Blue Ribbon meeting for all sides to talk didn't happen :(  Now here we are, still kicking the can down the road, hoping new sites will magically appear so we're not building in parks like MLK or saturating the entire north side of town with new housing and no services for all the folks moving in. I don't have all the answers and YES it's complicated, but I have faith in our community and encourage respectful dialogue because that's the only way we can build what WE want to see, not what the state tells us. Sausalito is not like every other city in Marin County, we are a waterfront community with a rich maritime history, not to mention hundreds of artists and makers who make this town so special. We might disagree on some stuff, but that doesn't mean we can't have a civil conversation. I know I've appreciated all the history I've learned from local (longtime) residents. I cannot learn if I don't listen so I hope you will join me in having these difficult conversations because I'm sure I can learn something from you and hopefully we will find more similarities vs. differences :)", "screenshot": null}, {"comment_id": "comment_1604481788", "author": "Kelly Doyle", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron I disagree with your supply and demand theory when it comes to real estate.", "screenshot": null}, {"comment_id": "comment_1604503830", "author": "Adrian B.", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Fear of displacement is a real thing for some, and change is scary. Unfortunately, we've prevented investment in the area for 40 years, and we can't wait any longer.\n\nVarda Landing and Marinship Studios flooding regularly risks displacing artists. Crumbling sewers and roads risks driving out the makers who make Marinship what it is. \n\nOur plan is designed to encourage more spaces for artists and makers, revitalize the economy of the area, start to have a realistic plan to address the infrastructure issues. It is the first step towards solutions.\n\nIt's time.", "screenshot": null}, {"comment_id": "comment_1604784768", "author": "W", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Adrian Why don't you visit Alameda and see exactly what you are encouraging here in Sausalito.", "screenshot": null}, {"comment_id": "comment_1604802149", "author": "D", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lynn and you have a great point too. Perhaps we can consider property based rental agreements, such as project based apartment buildings where the amount of rent is dependent on the income. This could be a consideration in order to grandfather in existing businesses which may not be able to afford high rents like those of the downtown area. Anyway, just a consideration.", "screenshot": null}, {"comment_id": "comment_1605015962", "author": "Ginny Erwin", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "We need to maintain Sausalito‘s quiet docs, local stories, and a way of life that shaped the value and specialness of Sausalito. When developers want to create large commercial districts, it becomes over developed, and the village may grow richer and profit, but poor in soul. Once the charm is gone, there is no amount of progress that can bring it back. Say no to AIM.", "screenshot": null}, {"comment_id": "comment_1605475880", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Dunie I don't know much about what property based rental agreements mean.  I do know from working on new construction buildings in my previous career that a portion (2%-someone correct me if I'm wrong) are offered to low-income residents.  I believe this is mandated by the state. (Again, correct me) I don't know who has been grandfathered in for existing business in the Marinship.  I'm hoping those that already have long leases. But I know many have been pushed out over the last 10 years by landlords.  I myself had a 33% rental increase during Covid, for G-D's sake.  Cruel.  Especially for an art teacher.   You make some good points.", "screenshot": null}, {"comment_id": "comment_1605485562", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "I’m not sure if we’ve formally met, Adrian, but I’d be happy to connect in person—sometimes it helps to put faces to names and have a direct conversation.\n\nI’ve been hearing updates about recent discussions, including Ian being at MarinMade yesterday and speaking with the owner, and I’d appreciate any feedback or transparency that can be shared from those conversations.\n\nI want to speak candidly about the flooding concerns, particularly around Gate 5 and the landfill subsidence.  The tide was inches from my sill and about to enter my studio.  The presence of FEMA following that event was surely welcomed, and I know the infrastructure and how it will be paid for is on the table with finding solutions. \n\nWhile I understand and appreciate the intention behind expanding spaces and supporting the creative community, those of us located on Varda and within the Marinship feel we are in a particularly vulnerable position—caught between development pressures, environmental concerns, and our own realities.\n\nThis isn’t coming from fear, but from lived experience and a desire for responsible planning. Is there a way to provide clear, enforceable assurances around limits to development, infrastructure safeguards, and flood mitigation? Something more binding than general intent—ideally, documented commitments that residents and tenants can rely on. Meaning sworn documents by attorneys that guarantee agreements on over-building.  Does that make sense?\n\nAlso, while I hear that community input is being encouraged, it’s important to acknowledge that final decisions ultimately rest with a small number of council members. (Meaning three) That dynamic makes transparency and accountability even more critical.  It's not really the voice of 8,500 or so citizens of Sausalito speaking. \n\nI’m open to dialogue and would genuinely value being part of a more INCLUSIVE and informed conversation moving forward.  Thank you for caring about our community.", "screenshot": null}, {"comment_id": "comment_1605568495", "author": "Jessica Snow", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Thank you Tracey for bringing attention to this important issue.  We see in SF what happens when a place is no longer affordable for artists.  The life and cultural vibrancy of the placed is sucked out, and the city is now a hollow shell of what it once was.  Artists left, then the great art schools and many galleries closed down.  It is so sad! Sausalito has plenty of cafes, restaurants, and boutiques. What is needed is affordable places for artists to live and work.", "screenshot": null}, {"comment_id": "comment_1605595097", "author": "Annabelle J.", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "I am a Founder of the non-profit; Sausalito Working Waterfront Coalition (SWWC). We have been working/advocating for 7 years (on an all volunteer basis) to uphold the core principle of preserving Arts, light Industry and Maritime uses in the Marinship.\n\nSausalito Thrive’s attempt to throw together a group under a new name this year doesn’t confuse anyone. Despite the acronyms and objectives being canvassed to confuse (mirror SWWC principles), it’s the same business/property owners having yet another stab at development. \n\nIf Thrive’s true intention in this “AIM” (Arts, Industry, Maritime) initiative was to preserve those uses, wouldn’t they reach out to an organization which is well established, educated and committed to this very cause!?\n\nNO! Because that isn’t the organization’s intention with this initiative. \n\nI encourage the public to read this flyer showing a few facts about the AIM initiative and DO NOT SIGN your democratic rights away.", "screenshot": null}, {"comment_id": "comment_1605618339", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Kelly supply on demand comment was on rents. And what about the artists that don't have ICB studios now? I want there to be more places like that. The only certainty is that without this measure, the current laws make that impossible.", "screenshot": null}, {"comment_id": "comment_1605621421", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Walter we don't want Alameda either but there are several examples of working waterfronts that also encourage growth of the things that make them special, namely the artists, maritime businesses and industries that we want more of, plus more supporting business like restaurants, coffee shops and other local scale uses. Which all help pay taxes for keeping the marinship in good repair.", "screenshot": null}, {"comment_id": "comment_1605631640", "author": "W", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron I think that all sounds great but memories fade from the pandemic when the light industrial tax revenue kept our city afloat. There is only so much room in the Marinship and all the good stuff you suggested raises per sq ft rent rates and light industrial cannot survive any more rent increases. Similar to the fast food minimum wage exercise - that didn't go well but some people still don't recognize the consequences.", "screenshot": null}, {"comment_id": "comment_1605635771", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Walter you're right, but we need even MORE tax revenue if we're literally going to keep the marinship \"afloat\". I'm sure you've seen gate 5 earlier this year, that will soon be all the time if we don't invest in the infrastructure. So we either have to raise taxes on everyone (NO!) or increase our tax base by building more commercial and industrial.\n\nFurthermore, we can be purposeful and thoughtful about preserving existing businesses using tools available to the city in exchange for building permits land owners will need.\n\nAgain, doing nothing is not an option. But doing something thoughtful and respectful to the businesses and artists that make this place great is totally possible.", "screenshot": null}, {"comment_id": "comment_1605637798", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Annabelle I'm confused how putting something on the ballot TO VOTE ON is undemocratic. \n\nAs you post, we want the same things. We have a real plan to actually accomplish keeping our current artists and industries while also creating space for MORE and in doing so, getting tax revenue to pay for it all. That's what I call sustainable.", "screenshot": null}, {"comment_id": "comment_1605639808", "author": "W", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron What can be done is for the city to enforce the zoning codes which they refuse to do. That will add a lot more commerce and tax revenue. Simple but we have to have a competent government to pull that off.", "screenshot": null}, {"comment_id": "comment_1605647840", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Walter sure they should do that too, there is a new city manager soon so I encourage you to make that point to her. But doing nothing results in certain failure. I believe we can take control of this situation and end up with something better.", "screenshot": null}, {"comment_id": "comment_1605661730", "author": "Annabelle J.", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron the AIM initiative would remove Sausalito residents’ right to vote on waterfront zoning changes and hand it over to a 3 majority City Council. \n\nAlso, it strips away Marinship Specific Plan protections requiring artists to be  in certain office use spaces.\n\nWhat is your “real” plan to keep current artists while stripping away their protections?", "screenshot": null}, {"comment_id": "comment_1605676673", "author": "Lauren de Remer", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Thank you, Tracey! Yes, this AIM Initiative terribly written and I see it as a wolf in sheep’s clothing…100% . It also takes away our rights as residents to control waterfront zoning. Adding up to 40% retail use will be the death of our maritime growth potential, which is the strongest economic investment our city has in front of us. Thank you for your post!", "screenshot": null}, {"comment_id": "comment_1605676863", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "When was the last time anything was actually approved under the current plan? The current plan resulted in Measure J, which was a raw deal: we ended up handing over incredibly generous zoning and the community got nothing in return. \n\nAIM makes the Marinship work how zoning works literally everywhere else in Sausalito and the rest of Marin. City council, planning commission and CEQA all apply. And more can be done to further extract only the kind of buildings and tenants we want as a community through specific planning agreements. The current system is just a default no to everything, this \"vote of the people\" is just a thin veil over a posture of doing nothing. That posture will literally drive us into the ground and then under the water as we will not be able to afford the much needed infrastructure work required to keep the Marinship sustained.\n\nAs to the Marinship specific plan, as written it only gives protections to the things that were already in place 40 years ago. Do you not want to see more artists? More maritime businesses? I do. If we actually work with local government, it turns out you can protect the artists and small businesses that make this place what it is while converting the vacant and run down lots into new spaces for more creatives, artists and maritime businesses. As a business owner (in industrial manufacturing), I looked at opening our shop in the Marinship and ultimately couldn't due to a lack of infrastructure, accessibility and labor force.\n\nI realize we may not agree entirely on all the points, but I'm hopeful we can at least agree we have to try to do something before we actually run out of time.", "screenshot": null}, {"comment_id": "comment_1605679438", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Adrian Thanks for reaching out to speak in person.  I would welcome the meeting.  Next Tuesday afternoon works great.  I'll DM you as well.  Let's keep conversati on on the thread for transparency sake.  Sound good? :)", "screenshot": null}, {"comment_id": "comment_1605686108", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "also wanted to paste this directly from the initiative text:\nHere's a samplings of the uses permitted from the top under the amended plan, which clearly includes ARTISTS.", "screenshot": null}, {"comment_id": "comment_1605687342", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lauren 40% is what's in the current law, that's not new from AIM. I'm curious what the wolf is in your analogy? (I mean this as a genuine question). \n\nYes, this allows for commercial uses that are more broad than current, including fishermen to be able to actually sell fish, bakeries to sell bread, etc. It also allows us to build new maritime, artistic and industrial buildings so we can expand those very important sectors.  And most importantly, it unlocks tax revenue to help pay for the infrastructure required to keep the Marinship functional in the face of sea level rise.", "screenshot": null}, {"comment_id": "comment_1605923397", "author": "C", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Ginny sadly a lot of artisans and ship builders can’t afford to live or work in Sausalito. And they are part of the soul of our city. We need more ways to keep them here and AIM gives them more space to work and operate out of.", "screenshot": null}, {"comment_id": "comment_1605926025", "author": "C", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Annabelle Ordinance 1022 blocked Sausalitians right to make decisions about our city’s waterfront. AIM gives citizens a right to have their voice heard at the ballot box and with city council instead of having their voices silenced by a 40 year old ballot measure.", "screenshot": null}, {"comment_id": "comment_1605929827", "author": "C", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey I agree with you that Ordinance 1022 is outdated. What would you change about Ordinance 1022 to bring it up to reflect the realities of today’s waterfront?", "screenshot": null}, {"comment_id": "comment_1605948490", "author": "Adrian B.", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey Looking forward to meeting you.", "screenshot": null}, {"comment_id": "comment_1605978871", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Adrian same!", "screenshot": null}, {"comment_id": "comment_1605981785", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Charles you make a valid point.  But nobody I ask can seem to tell me what rents will be for a studio/1 br or a live/work.  Who can give me a number and a guarantee rents would stay the same through the year.  Those that make under $40k and less a year.  Anyone?", "screenshot": null}, {"comment_id": "comment_1605986199", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lauren That’s an interesting way to put it “a wolf in sheep’s clothing” The artistic soul in me wants to believe that is not true but my past history has shown me proof of how it works. I mean look at how a lot of people who voted for Trump have regreted it.", "screenshot": null}, {"comment_id": "comment_1605990822", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron I keep asking about what the rents would be.  Can there be a law set in place that guarantees long-term leases at below market value?  I’m not a lawyer. Can someone chime in? Why would a developer or property owner agree to that?  Some property owners have kept people on 30-day leases for decades!  That gives no security to people who fall into that category.", "screenshot": null}, {"comment_id": "comment_1605994789", "author": "C", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey your Nextdoor location says Waldo Point. Do you vote in Sausalito elections?  Or do you live outside Sausalito city limits?", "screenshot": null}, {"comment_id": "comment_1606024831", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Charles I know.  When I moved here 11 years ago, Gate 5 Nextdoor wasn't up and running.  Nextdoor asked me to be the lead but at the time, I couldn't take it on.  Plus this neighborhood looked sketchy to me (obviously) but Marinship studios came in and fixed it up as well as the King Tide Band recording studio.  They invested in the arts.  I've tried to change it but can't seem to figure it out.  I do vote in Sausalito.  I'm in the building right next to Reason's which is the cut-off line.  Trust me, I've tried to get the 800 voices of the houseboat community  to push for being included in this city.  But seems it's all about their property taxes going up. What I have been told.", "screenshot": null}, {"comment_id": "comment_1606032592", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron yes to some of this! That's why I posted.  I am in the middle of all of this thinking. I'm not sure why I wasn't invited to those creating the AIM as I'm part of some of these groups.  The two property owners who moved in 6 or so years ago, privately cleaned up the place.  We are beyond thankful they are here. I want to see it all work out to the towns favor.  My history and others have seen it happen in cities all over the country.  How do I believe this is all fact.  I can't rely on wishful thinking.  I'll check in with my artist friend in the Dogpatch who has been there 40 years.  I was there for the beginning of that renovation.", "screenshot": null}, {"comment_id": "comment_1606035184", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Charles that is what I am asking on both sides of all of these questions.  Yes, bring a valid solution and action to make it happen.  I appreciate the AIM initiative coming to the table because that is what they are trying to do.  No one is talking about developers here.  Can someone chime in more on this topic? And with real numbers.  I appreciate the question.", "screenshot": null}, {"comment_id": "comment_1606035358", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron Let me research this chart more.", "screenshot": null}, {"comment_id": "comment_1606039498", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Also, here is a very crude cut-and-paste, as I didn't have time to make a proper presentation in Photoshop.  Why do you think these property owners let it get to this stage?  Sitting on this property for all of these years? From what I hear, the elderly women who own the dilapidated trailers didn't want to be in discussion.  The Lemons property? Why did they let it get to that stage?", "screenshot": null}, {"comment_id": "comment_1606048193", "author": "Adrian B.", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey There are many things that contributed to the current state. One big reason is that the building and use restrictions make it basically impossible to build anything that makes economic sense. \n\nLet's fix that. \n\nAIM is not a magic bullet, but it's a big step in the right dirction.", "screenshot": null}, {"comment_id": "comment_1606090849", "author": "D", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey i’ll chime in a little bit here from 60 year born and raised Sausalito resident perspective. The artistic community means more to me than anything in Sausalito. The last thing I would ever vote for or want is to reduce the amount of artists, let alone kick out the ones that currently use the marinship space. If I was on the city, counsel or mayor, I would propose grandfathering people in. Unfortunately I am not in any sort of political role so I really have nothing to do with that. I am for fixing up the waterfront and retaining mixed use for artists and new businesses for profit. It would be nice to have a little apartments there that are affordable for new generations. I believe my perspective is does not stand alone. There are hundreds of us if not thousands who want Sausalito to be fun and exuberant and colorful like it was in the 70s. We’ve lost that appeal and we do need to get it back. Anyway, that’s my two cents.", "screenshot": null}, {"comment_id": "comment_1606100705", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Dunie , thanks for the two cents.  It's great to hear from a long-term resident.  I bet you have some great stories from the 70s! Especially down here.  I get mayhem, though, with the sewer situation.  Apparently, you could smell it from the 101.  Perfect timing, as I just saw this article posted today.  It's my history telling me otherwise.  I was in SF for 10 years and pushed out.  It was a miracle, I ended up in Sausalito.  This town was not my plan, but now it's my solid community, and I don't want to be pushed out as well as my AIM community of friends.", "screenshot": null}, {"comment_id": "comment_1606100798", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "https://nextdoor.com/p/xCNhkk36_ktR?utm_source=share&extras=MTEwNDQw&utm_campaign=1779307580678&share_action_id=cd635322-e662-42b2-a6ec-b320f11f0367", "screenshot": null}, {"comment_id": "comment_1606101269", "author": "Adrian B.", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Annabelle I've reached out to John and Craig at SWWC many times, as recently as a few days ago. I almost never get a reply, and my requests to talk have been refused.", "screenshot": null}, {"comment_id": "comment_1606314213", "author": "D", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey I have fantastic memories. My dear friends are still along the waterfront and they’re the best group of people you’ll ever meet. You might even know some of them :) I wouldn’t push you out and I don’t believe Sausalito wants to push you out either. We actually want this to be 100% inclusive. It’s scary to think that you could lose everything you workef for and lose your home or “living room” to outsiders who could give a crap  about your needs. It’s scary to think that our waterfront could be turned into some plastic looking hoity-toity Palm Beach area. That is not what we want. That is not the plan. Absolutely no way! We wish to keep it an absolutely working waterfront etc. etc. etc.. but tidy, viable, walkable, sailable, functional AND a comfortable enough place that locals can use it as their living room.", "screenshot": null}, {"comment_id": "comment_1606341043", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey yes this is absolutely possible in the context of a community developments agreement. Unfortunately the current version of 1022 prevents this from happening. It's also why why I'm not advocating for a wholesale repeal of 1022, we need some way to be able to negotiate with land holders so that they can still get more value out of their land preserving the things that we want in the marinship.", "screenshot": null}, {"comment_id": "comment_1606345568", "author": "Annabelle J.", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Adrian I‘m unclear why you are making unsubstantiated comments about our flyers? We don’t have any with images of the Mathew Turner on them and all of our flyers have our name at the bottom.", "screenshot": null}, {"comment_id": "comment_1606449680", "author": "Adrian B.", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Annabelle, sorry, I thought they were connected because the flyers were all posted together. Are they not? \n\nJohn and Craig have been unresponsive, but I didn't know you were in the leadership there. Would you be willing to meet? \n\nI see a great amount of common ground in our goals.", "screenshot": null}, {"comment_id": "comment_1607310542", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey AIM doesn't directly do anything for developers. All it does is make the zoning change procedure the same as the rest of the city and remove some of the restrictions on business types on the marinship. \n\nThe most important part is what happens after the restrictions are fixed. With careful and collaborative planning, the city can work with residents and business owners to promote the things we want more of, within the confines of the zoning (i.e..max 4 stories, and only 65% height.of the current ICB building).", "screenshot": null}, {"comment_id": "comment_1607498441", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Annabelle I'm happy to meet whenever and help fix some of the mathematical errors in your flyers. For context, AIM has a 46ft height limit which means 3-4 stories, or 65% the envelope of ICB. I would like to see more spaces for great local businesses and artists.", "screenshot": null}, {"comment_id": "comment_1607553756", "author": "R", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey New buildings will create a significant increase in the tax base. Tax increment financing allows the city to use future tax revenue from this future development to fund investments today. This could be used for things like addressing sea level rise or building dedicated spaces for artists, nonprofits, etc. While all of this is legally and technically possible, it requires folks to work collaboratively and encourage investment to fund these projects.", "screenshot": null}, {"comment_id": "comment_1607589469", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Charles My understanding is that the final say is our 5 council members will have the final say.  Yes, the citizens vote.  Am I missing something?", "screenshot": null}, {"comment_id": "comment_1607592902", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron careful and collaborative is the key point.  You are correct in your thinking.  Agreed.  The what happens. Do SWWC and SSWA speak now?", "screenshot": null}, {"comment_id": "comment_1607716632", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert That's correct.  I totally understand that part.  Did you see this flyer. Thoughts? Blight by design.\n\n\"Demolition by neglect\" is a common real estate tactic where landowners defer maintenance, allow deterioration, or underutilize a site to pressure local governments to rezone for higher value redevelopment.\" Pardon the cut and paste.  I don't have a pdf of it.", "screenshot": null}, {"comment_id": "comment_1607718313", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Dunie Yes, I understand all sides of the situation.  But I am truly in the middle as others in my boat are in the same.  Do you understand what I'm saying? And, yes, I'm sure we have many friends in common on the docks.", "screenshot": null}, {"comment_id": "comment_1607720165", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Also, someone (not anyone I know) left really nasty comments on SeaTrek and Fjord's Yelp, which I love both of these businesses.  This is the unfortunate part of politics that is just not fair to the small business owners.", "screenshot": null}, {"comment_id": "comment_1607735160", "author": "R", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey tax increment financing is only available when the property value increases relative to current values. Property value increases when new things are built. New things are only built when people can make money building them. Right now they can’t make money building something new, so they don’t. It’s up to you to decide if that’s malicious or just economics.", "screenshot": null}, {"comment_id": "comment_1608402411", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert You and I both know this game.", "screenshot": null}, {"comment_id": "comment_1608405439", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron What does \"wholesale repeal of 1022\" mean?", "screenshot": null}, {"comment_id": "comment_1608784737", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey this is how all other land use works today, city council, planning commission and CEQA are the gates that make the rest of Sausalito have the charm it does.", "screenshot": null}, {"comment_id": "comment_1609137806", "author": "J", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "This is just another land grab which has nothing to do with artists or community - just development, profits, and gentrification - all things which have no further place in Sausalito. That's what cities like San Jose are for - please concentrate your hypocritical efforts there. Thanks!", "screenshot": null}, {"comment_id": "comment_1609204584", "author": "R", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Charles 1022 does Not block residents voting. AIM seeks to remove residents and put votes in the hands of the council members.", "screenshot": null}, {"comment_id": "comment_1609216548", "author": "R", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "A public/community meeting to discuss AIM, et. al., is taking place June 4, 2026, 5:30 pm in the Spinnaker Banquet Room.  With a panel, Q&A, and 2 videos. It is a chance to hear all sides.  Please plan on coming to this free and open meeting.  Please spread the word. Sponsored by the nonprofit RBMA.", "screenshot": null}, {"comment_id": "comment_1609252717", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Jon the people behind the initiative are severely concerned about the future state of our Marinship. If we do nothing, we will lose wat makes this place special. Generic \"land grab\" comments are unproductive and not based in any fact or evidence as this is a citizen led initiative.", "screenshot": null}, {"comment_id": "comment_1609265967", "author": "Adrian B.", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Roberta It's important to note that there will be NO representative of the AIM petition on the panel, so this is really not a chance to hear all sides. We are also not represented by either of the two videos. \n\nWe will be in the audience and available to talk, though.", "screenshot": null}, {"comment_id": "comment_1609361009", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Roberta Thanks for the post.  I’ll be out of town then but hope it’s recorded so i can get the notes.  Here is the non-profit for those that do not know it. https://www.richardsonbaymaritimeassociation.org /", "screenshot": null}, {"comment_id": "comment_1610238288", "author": "R", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron the AIM initiative only protects two specific properties.  Nothing in the initiative requires specific uses of new development. Industrial property is the most open type of zoning. Almost any development and business fits into that. Demand will rise for non artist uses and drive artists out.", "screenshot": null}, {"comment_id": "comment_1610246887", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Richard not true. The modification to the marinahip specific plan changes the permitted uses to a broader, but still narrow, set of uses that match the character we want to see in the Marinship.\n\nFurthermore, once AIM passes it is absolutely possible for a city council to create community development agreements to encourage artists, even live/work studios which help address our lower income housing requirements, keep our artistic vibe, an are generally just good for the community.\n\nThe point is without this, were left with a current regulatory framework that says no to anything and that's is absolutely not sustainable.", "screenshot": null}, {"comment_id": "comment_1610250815", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Roberta functionally residents can't vote on anything because THERE IS NOTHING TO VOTE ON. It's a political hack that makes a good sound byte when in fact it's just a NO on any new businesses.", "screenshot": null}, {"comment_id": "comment_1610262353", "author": "R", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron possible, not required. Thats the flaw. Im not against change or development, but without protections local people, businesses and artists will be forced out.", "screenshot": null}, {"comment_id": "comment_1610274351", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Richard that's the point, the people elect council that prioritizes the right kind of development. Right now people are deprived of this right. We have to fix one problem at a time but I can say that there is support from those of us championing this effort to go even further to protect artists and maritime businesses that make this special. I welcome you and others to join us in that mission.", "screenshot": null}, {"comment_id": "comment_1610278015", "author": "R", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron its interesting to see some of your other posts regarding the MLK project. It doesn't seem as though you 100 percent trust the council", "screenshot": null}, {"comment_id": "comment_1610279254", "author": "R", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "My point only is that you should solidify the plan before opening it up to drastic change. You're putting the cart before the horse and it will have negative consequences that you can't fully understand right now.", "screenshot": null}, {"comment_id": "comment_1610281342", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Richard nothing can be worse than what is happening now, flooded roads, vacant lots and businesses going under because they are unable to sell the things they make.\n\nTaking this one step at a time is the path. The city can't make a CDA with 1022 in place so I'm unsure what other path you're referencing. Other folks who have claimed the cart is before the horse are actually just interested in the horse not going anywhere.", "screenshot": null}, {"comment_id": "comment_1610293272", "author": "R", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron dont misinterpret people concerned as being anti change. It will help everyone to listen to valid concerns and not dismiss them.", "screenshot": null}, {"comment_id": "comment_1610309584", "author": "M", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Richard I understand your point about listening and I applaud Aaron for actively listening and engaging with you to encourage productive dialogue within our community. Good stuff, not dismissive at all - more like informative facts, which I appreciate and hope to see more of 🙏 God bless this gem of a town  - together we are stronger 💪🏼", "screenshot": null}, {"comment_id": "comment_1610373284", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Michelle Richard Aaron can someone tell me, if city council votes for the AIM initiative, the zoning still will remain “I” and not “MU” ?", "screenshot": null}, {"comment_id": "comment_1610375140", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey technically the people vote for AIM in November, not city council. \n\nBut the more important question, no it does NOT change the zoning to MU.", "screenshot": null}, {"comment_id": "comment_1610382798", "author": "R", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Roberta it is extremely unfortunate if RBMA is not allowing any representative of the AIM initiative to participate on its panel. That does that sound like an honest effort to allow all sides to present their positions.", "screenshot": null}, {"comment_id": "comment_1610396624", "author": "Michelle C.", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron , Historically, supply and demand hasn’t swayed Sausalito rental costs. Tracey has asked a few times in several threads discussing this subject, if you know what the rent prices will be for a studio or 1 BR. Do you have a number?", "screenshot": null}, {"comment_id": "comment_1610398615", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Michelle as I said before, I don't own land in the marinship so I don't set rents.\n\nWhat I can say is we do not have enough studios for all the artists who want to work in Sausalito. Wouldn't you want there to be more studios for more artists? What about work/live studios?", "screenshot": null}, {"comment_id": "comment_1610518996", "author": "C", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Roberta since Ordinance 1022 was put in place, voters have been blocked from making even incremental decisions about the waterfront. Even common sense issues like allowing ICB artists sell their artwork in the building (retail is not allowed). Our city council is elected by voters. Every other city’s elected local government makes land use decisions. AIM gives residents a voice once again both at the ballot box at city council.", "screenshot": null}, {"comment_id": "comment_1610542970", "author": "Ginny Erwin", "klass": "new", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Let’s look a the financial books, where is the money going? The B of A building was purchased by the city for the artists - how is that going?\nI believe the city is subsidizing the rent. This venue was supposed to be for local artists to show and sell their works of art. \nResidents have a right to know who, what, where, when and how progress is being made. There are pros and cons to every project in the city.", "screenshot": null}, {"comment_id": "post", "author": "R", "klass": "edited", "run_id": "2026-05-26T17:48:23Z", "observed_at": "2026-05-26T17:48:49Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "12 May", "edited_marker_text": null, "body_text": "What's going on with the late night helicopter in Sausalito?", "screenshot": "data/posts/p_Q_Zh53rkkW9Q/captures/2026-05-26T17-48-23Z__post__edited.png"}, {"comment_id": "comment_1610720522", "author": "Michelle C.", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:49:22Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron , thank you for answering. \nSo, there could be a bunch of pricey empty spaces that artists want but can’t afford. -Just trying to understand so I can form an opinion.", "screenshot": null}, {"comment_id": "comment_1610858919", "author": "Michelle C.", "klass": "new", "run_id": "2026-05-26T21:18:10Z", "observed_at": "2026-05-26T21:18:39Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron , Who are “the people behind the initiative?” Why and when did it come to be?", "screenshot": null}, {"comment_id": "post", "author": "Tracey Kessler", "klass": "edited", "run_id": "2026-05-26T22:18:38Z", "observed_at": "2026-05-26T22:18:45Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "17 May", "edited_marker_text": null, "body_text": "Neighbors and friends of Sausalito,\n\nI’ve had a lot of people reaching out to me about this new initiative. On paper, it sounds incredibly positive—but let’s take a step back and think about how real estate and development actually work.\n\nWill this push out artists? Most likely. Artists here are currently paying around $3.75/sf—what do you think happens to those rates when new development comes in and the area becomes more “desirable”? Prices don’t go down.\n\nI understand the appeal of creating a charming district with coffee shops, retail, and local vendors. It sounds beautiful. But we’ve seen this story before—it risks becoming another version of Fisherman’s Wharf. These ideas often look great in theory, but the long-term impact tells a different story. Trust me, I want the cute coffee shop where I can sit and linger with friends.  A lunch spot right outside my studio. But at what costs?\n\nPlease also consider how politics and development decisions are made. I strongly urge you not to sign the petition to change Ordinance 1022—outdated as it may be—until more open and honest conversations happen.\n\nI’ve lived through this cycle in New York, Philadelphia, and San Francisco. Artists and creatives help build the character of a place—and then they’re priced out. People say they support the arts, but that support often disappears when real financial opportunity enters the picture.\n\nAnd regarding “affordable housing”—what does that actually mean here? What will a one-bedroom cost? I’d genuinely like to see real numbers.\n\nI know many of my friends are supporting this initiative. You know where I stand. If you want to talk more about it, please reach out—I think this deserves a deeper conversation.\n\nThere are A LOT of different groups forming that are confusing people. \nThis is a beautifully designed website, for sure.  But if you are smart enough to know how this works, think again. https://www.sausalitothrive.org / https://www.sausalitothrive.org/endorsements The Sausalito Working Waterfront Coalition put this documentary out about 5 years ago.  Since that time, pushback has really enhanced.  This is one complicated issue in our small town. https://www.sausalitoworkingwaterfront.org/documentary 37.80822, -12 kingwaterfront.org/documentary 37.80822, -122.41581 CA", "screenshot": "data/posts/p_Q_Zh53rkkW9Q/captures/2026-05-27T00-18-36Z__post__edited.png"}, {"comment_id": "post", "author": "R", "klass": "edited", "run_id": "2026-05-27T00:48:21Z", "observed_at": "2026-05-27T00:48:51Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "12 May", "edited_marker_text": null, "body_text": "What's going on with the late night helicopter in Sausalito?", "screenshot": "data/posts/p_Q_Zh53rkkW9Q/captures/2026-05-27T00-48-21Z__post__edited.png"}, {"comment_id": "comment_1611049884", "author": "D", "klass": "new", "run_id": "2026-05-27T01:18:14Z", "observed_at": "2026-05-27T01:18:42Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Michelle This article in today’s IJ mention some of the people by name.  1000 residents have signed their name to support AIM. I signed in support because if there’s a chance the artists would be able to sell their art directly from their ICB studios, that a huge win. Here’s the article:  Sausalito Marinship rezoning supporters submit petition By Steven Rosenfeld UPDATED: May 26, 2026 at 3:38 PM PT  Supporters of a ballot initiative to remove decades-old obstacles to growth in Sausalito’s Marinship have submitted a petition to the city with more than 1,000 signatures. The measure seeks to revise Ordinance 1022, which voters approved in 1985 and blocks most new development in the 210-acre former World War II shipyard in the city’s north end. “We’ve made some pretty amazing progress on our AIM initiative petition,” Adrian Brinton, an organizer, said Tuesday. “We started circulating a week ago, Friday, and we basically gathered over 1,000 signatures in 10 days,” he said. “We just submitted our signed books to the city clerk this morning.” Seventeen unpaid volunteers gathered the petition signatures, said Sharna Brockett, another organizer. About 550 valid signatures – 10% of the city’s voters – are needed to qualify.  “Wow, that speaks volumes for them,” Mayor Steven Woodside said. “Assuming the signature count holds up and they meet the required percentage, it will go on the ballot.” The old shipyard has numerous sections. Its southern end is dominated by hulking boarded-up machine shops, lots filled with shipping containers, and run-down structures and vehicles. Closer to the shoreline, its mid-section contains working boatyards, marinas and artist studios. Other pockets have a handful of offices, restaurants and other businesses. Last November, voters rezoned several lots in its northern tier for state-mandated high-density housing. A developer has notified officials it seeks to build a 294-unit apartment complex on a 3-acre site. The ballot measure and its amendments are a 266-page document that proponents say would balance preservation and modernization.  “We have an artist community. We have industrial work. We have shipyards, boat-building. And we also have blighted areas,” Brinton said. “We also have areas that have been really lacking in investment for decades. And our codes and/or rules around what can get built are extremely restrictive and also put in by voter mandate.” “It really can’t be economically developed to add new workspaces, so we created the AIM initiative,” he said. During the past 20 years, numerous master planning efforts by city officials have languished due to local frictions and a lack of political will, Ray Withy, a former mayor and initiative supporter said. “It needs to be repealed because in planning sessions people start narrowing their thinking,” he said. “They suddenly say, oh we can’t do that because it’s against 1022, and so the whole debate gets narrowed.”  “The most important thing it does is return control back to the City Council,” Withy said. “It is really forcing the City Council to act.” Related Articles\n  • George Russell: Sausalito looks at updating Marinship area plan   • Sausalito pro-growth group pushes Marinship changes   • Sausalito gets proposal for nearly 300 apartments  “This is about breathing new life into our waterfront and investing in our industrial zones,” Brockett said. “When this passes, a lot of businesses down there will be able to regularly sell what they create, what they catch … it does not rezone for housing or hotels or anything like that.” Once petition signatures are verified and the measure qualifies, Woodside said the city attorney will write an impartial analysis and summary. “I urge everyone to stay tuned and pay close attention,” he said. “I urge people to look at the purposes of this initiative and try to understand them.” “Very little has happened over the last 40 years,” Woodside said. “I think that’s probably why a number of people in the community are interested in some level of change.”", "screenshot": null}, {"comment_id": "comment_1611060240", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-27T01:18:14Z", "observed_at": "2026-05-27T01:18:42Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Ginny there are no secrets here. If you have a question about funding, who is involved, etc check out sausalitothrive.org or just ask.", "screenshot": null}, {"comment_id": "post", "author": "Tracey Kessler", "klass": "edited", "run_id": "2026-05-27T01:48:11Z", "observed_at": "2026-05-27T01:48:19Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": "17 May", "edited_marker_text": null, "body_text": "Neighbors and friends of Sausalito,\n\nI’ve had a lot of people reaching out to me about this new initiative. On paper, it sounds incredibly positive—but let’s take a step back and think about how real estate and development actually work.\n\nWill this push out artists? Most likely. Artists here are currently paying around $3.75/sf—what do you think happens to those rates when new development comes in and the area becomes more “desirable”? Prices don’t go down.\n\nI understand the appeal of creating a charming district with coffee shops, retail, and local vendors. It sounds beautiful. But we’ve seen this story before—it risks becoming another version of Fisherman’s Wharf. These ideas often look great in theory, but the long-term impact tells a different story. Trust me, I want the cute coffee shop where I can sit and linger with friends.  A lunch spot right outside my studio. But at what costs?\n\nPlease also consider how politics and development decisions are made. I strongly urge you not to sign the petition to change Ordinance 1022—outdated as it may be—until more open and honest conversations happen.\n\nI’ve lived through this cycle in New York, Philadelphia, and San Francisco. Artists and creatives help build the character of a place—and then they’re priced out. People say they support the arts, but that support often disappears when real financial opportunity enters the picture.\n\nAnd regarding “affordable housing”—what does that actually mean here? What will a one-bedroom cost? I’d genuinely like to see real numbers.\n\nI know many of my friends are supporting this initiative. You know where I stand. If you want to talk more about it, please reach out—I think this deserves a deeper conversation.\n\nThere are A LOT of different groups forming that are confusing people. \nThis is a beautifully designed website, for sure.  But if you are smart enough to know how this works, think again. https://www.sausalitothrive.org / https://www.sausalitothrive.org/endorsements The Sausalito Working Waterfront Coalition put this documentary out about 5 years ago.  Since that time, pushback has really enhanced.  This is one complicated issue in our small town. https://www.sausalitoworkingwaterfront.org/documentary 37.80822, -122.41581 CA", "screenshot": "data/posts/p_Q_Zh53rkkW9Q/captures/2026-05-27T01-48-11Z__post__edited.png"}, {"comment_id": "post", "author": "R", "klass": "edited", "run_id": "2026-05-27T02:18:46Z", ou increase supply you drive down prices. \n\nRegardless, I agree we do NOT want to displace artists and local businesses and it's worth putting out the AIM initiative does neither. \n\nIf you remember last year, we ended up passing measure K which will displace many artists and builders, and that is a direct result of this outdated law tying our hands behinds our back. Let's be smart, have a dialog and we have till November to vote on this and hopefully both preserve the things that make Sausalito amazing and improve the utilization of idle land and create tax revenues in doing so.", "screenshot": null}, {"comment_id": "comment_1604006478", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-29T07:48:55Z", "observed_at": "2026-05-29T07:49:25Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "I also have to say, the documentary is absolutely beautiful. It highlights all the things we want to not just preserve, but encourage more of. I'm in high tech robotics, having companies build maritime machines is amazing. We can do so much if we actually just let the marinship thrive.", "screenshot": null}, {"comment_id": "comment_1604042089", "author": "L", "klass": "new", "run_id": "2026-05-29T07:48:55Z", "observed_at": "2026-05-29T07:49:25Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Tracey makes a very valid point.  Artistic communities gather in affordable places, create an attractive vibe. Under the guise of improvement and yet more development, rents in existing spaces will rise to match the new/higher rental fees, pushing out the creative folks, and ruining the charm. These people belong here.  Landlords/developers are supporting this measure", "screenshot": null}, {"comment_id": "comment_1604141375", "author": "M", "klass": "new", "run_id": "2026-05-29T07:48:55Z", "observed_at": "2026-05-29T07:49:25Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lynn Ruining the charm? Hmmm I’ve lived here 10yrs, not a landlord or a developer,  just wondering why parts of the Marinship have been left to deteriorate - not a charming look if you ask me or the confused tourists 🤔 The Waterfront is for everyone and this time a group of well intentioned local residents from 2026 (not 1985) support this initiative because 40yrs is enough! I don’t want our gem of a town to become an expensive fossil. How are we going to pay for millions of dollars of infrastructure repair? Higher property taxes? NO THANKS I’ve paid enough and I still can’t get a cup of coffee at a local cafe or open up a business in Marinship to serve my community.  I moved here from SF so I don’t want Fisherman’s Wharf either. I want to give people the option to vote on this AIM initiative in November and have real dialogue. Tired of the outdated narratives rooted in fear - let the people of 2026 decide because we’re LIVING in the 21st century and hope to be here for another 10yrs 🙏", "screenshot": null}, {"comment_id": "comment_1604264835", "author": "Tracey Kessler", "klass": "new", "run_id": "2026-05-29T07:48:55Z", "observed_at": "2026-05-29T07:49:25Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron thank you for your thoughtful reply.  While the basic laws of supply and demand usually work that way, in this small, wealthy town, I'm curious if that would really work this way.  Yes, I see people supporting small business here and naturally I would be all for it but not at the cost of what will truly happen.  Trust me,  I moved here 11 years ago and was like \"what the hell is going on down here?\"   Why have these property owners let dilapidation happen?   Then I started asking more of the people who work and live here. The owners have no need to improve their properties of light industrial.  Why would the
