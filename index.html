, "observed_at": "2026-05-26T13:19:33Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604734254", "author": null, "klass": "deleted", "run_id": "2026-05-26T13:18:12Z", "observed_at": "2026-05-26T13:19:33Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604843758", "author": null, "klass": "deleted", "run_id": "2026-05-26T13:18:12Z", "observed_at": "2026-05-26T13:19:33Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604847875", "author": null, "klass": "deleted", "run_id": "2026-05-26T13:18:12Z", "observed_at": "2026-05-26T13:19:33Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604858845", "author": null, "klass": "deleted", "run_id": "2026-05-26T13:18:12Z", "observed_at": "2026-05-26T13:19:33Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604971288", "author": null, "klass": "deleted", "run_id": "2026-05-26T13:18:12Z", "observed_at": "2026-05-26T13:19:33Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604986582", "author": null, "klass": "deleted", "run_id": "2026-05-26T13:18:12Z", "observed_at": "2026-05-26T13:19:33Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1605277616", "author": null, "klass": "deleted", "run_id": "2026-05-26T13:18:12Z", "observed_at": "2026-05-26T13:19:33Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1605286184", "author": null, "klass": "deleted", "run_id": "2026-05-26T13:18:12Z", "observed_at": "2026-05-26T13:19:33Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1605287875", "author": null, "klass": "deleted", "run_id": "2026-05-26T13:18:12Z", "observed_at": "2026-05-26T13:19:33Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1605302446", "author": null, "klass": "deleted", "run_id": "2026-05-26T13:18:12Z", "observed_at": "2026-05-26T13:19:33Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1605641803", "author": null, "klass": "deleted", "run_id": "2026-05-26T13:18:12Z", "observed_at": "2026-05-26T13:19:33Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1608439043", "author": null, "klass": "deleted", "run_id": "2026-05-26T13:18:12Z", "observed_at": "2026-05-26T13:19:33Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1608441932", "author": null, "klass": "deleted", "run_id": "2026-05-26T13:18:12Z", "observed_at": "2026-05-26T13:19:33Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604033815", "author": "L", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Increasing supply has never driven down prices in the Bay Area, going all the way back to the end of WWII.  Not once.  Why would anyone think that it magically will now?", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604033815__new.png"}, {"comment_id": "comment_1604038610", "author": "P", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "You’re forgetting an extremely important point. The price will only come down when supply exceeds the number of buyers willing to pay the high price. Or, you can increase housing to the point the area is no longer desirable and prices will come down. My guess is you’ll hit the latter first.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604038610__new.png"}, {"comment_id": "comment_1604160943", "author": "A", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Supply and demand for housing as a commodity is different from consumables. That’s because “housing” isn’t “housing.” Increasing market rate units will potentially have a slight effect among market rate units, but if incomes spike and an area is desirable and has maxed out its capacity for growth and infrastructure the prices don’t come down…someone with plenty of money can buy or rent just to hold a place for occasional use. \n\nThat takes the unit off the market that serves locals; it induces more people to buy or rent from out of the area without need. An oversupply of some types of units can affect the pricing of those just adjacent in pricing, but at the point where prices start to fall at all the development stops because it is no longer profitable. \n\nOur housing policy doesnt account for that; cities are still  judged by “permits pulled” (to build) , not even by approvals or entitlements.\n\nNone of the market rate unit activity will ever help people living at  actual low income price points. As nothing is being built in those categories, the supply becomes very lopsided; large vacancy rates at the high end, increasingly lower availability at the low end. \n\nOur “low income” units are built for earners starting at $109,000. This has zero effect on the workforce that people frequently describe here as benefiting. Day workers, anyone close to minimum wage is unaccounted for on the RHNA (mandate) charts. Literally no increase in supply there — it’s the opposite. \n\nWhen Naturally occurring, older stock where people have been aging in place is upgraded or demolished for new housing the prices will never return to the fixed income level people had been paying. \n\nUnits cost about $1m  to construct. All units in our area. So the math says the prices go up. Without subsidy new housing becomes unaffordable to all but “good” earners.  “More housing”is used in a sentence the  same  way as “job growth.” \n\nJob growth is also inclusive number not broken down by income category except for market analysts  for economists. \n\nCreating 100 warehouse jobs is not the same as creating 100  software engineer jobs — but statistically and for general “news” reporting they are  lumped together.  \n\nThe jobs being created now swing wildly at two ends:  high and low. But the housing is only serving one of them.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604160943__new.png"}, {"comment_id": "comment_1604164999", "author": "R", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Paul so prices only go down when supply exceeds demand, or when supply exceeds demand? Sure sounds like we should consider letting supply exceed demand", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604164999__new.png"}, {"comment_id": "comment_1604227951", "author": "P", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert over the last 50 yrs we have doubled the number of houses in Marin and the prices have gone up 1,400%. So far more housing hasn’t reduced prices. You’ll make the area an undesirable mess before you run out of people willing to pay the high prices. So it sure sounds like you’re advocating to make Marin an undesirable place to live and that’s disappointing.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604227951__new.png"}, {"comment_id": "comment_1604240183", "author": "T", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert But therein lies the problem. If supply does exceed demand an prices do drop -- they drop for everyone to include current home equity holders.  YIMBY  suggests a drop of up to 30% (voodoo economics) meaning if you have a condo valued at $1mm - 30% in value, your condo is now ~$700k. You just took a $300k haircut -- AND that's if you have equity.   There will be many with negative equity which is one missed payment away from walking away.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604240183__new.png"}, {"comment_id": "comment_1604240780", "author": "R", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Paul according to the 1980 census, there were 88,000 households in Marin, and today there are 103,000 households, with the bulk of that growth happening north of San Rafael. In 1980 the population of California was 23,000,000, today it’s almost 40,000,000. Hard to see that doesn’t increase relative demand for homes in Marin.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604240780__new.png"}, {"comment_id": "comment_1604245622", "author": "R", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "TOM please cite your source, I am not familiar with any group focusing on a decline in property values by a specific number", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604245622__new.png"}, {"comment_id": "comment_1604250347", "author": "T", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Amy This situation is becoming overcomplicated. The first principle concept is human nature. People want to work hard and make a lot of money. Then they want to live in a very nice area. The issue we're currently facing in Marin has been going on for 100's of years all over the world. The center of Paris, Jackson Hole, Aspen, the Hamptons etc etc. At some point we as human beings must accept we can't solve this -- only manage it. Extremely expensive areas will ALWAYS suffer that the people that support the community cannot afford to live there. That is a simple and hard fact. We can manage it to a certain degree -- but we can't fix with these over simplistic solutions put up by Trojan Horse groups like YIMBY. They present a solution which is just a self enrichment scheme which allows them to move on to the next high value community to savage whilst extracting as much money as possible from their current target. We just need to accept facts and not follow the siren song of non-solution -- solutions.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604250347__new.png"}, {"comment_id": "comment_1604270977", "author": "A", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "TOM I agree with you. And if we want to ameliorate the situation, we need to focus on available land — not clog it with luxury development with density bonuses and concessions — and instead focus on need and funding. Without forethought all of the areas you’ve mentioned have eliminated NOAH  and priced out workforce. So real decisions need to be made about what we are actually trying to accomplish. What’s happening right now is the opposite.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604270977__new.png"}, {"comment_id": "comment_1604277142", "author": "Roger Howard", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "TOM some others on this thread speak well to this issue of high cost of housing in Marin and why. Your paragraph summarizes all others attempts perfectly.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604277142__new.png"}, {"comment_id": "comment_1604280592", "author": "T", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert YIMBY routinely states that they want a 25-30% reduction in home values to make it more affordable to live in \"wealthy neighborhoods\" They use several different forms of calculus such as no more than 30% of your income to housing,  in order for Marin to become more affordable -- well you can do the math. I've attended their meetings and this is their bogey in residential valuation to make things \"affordable\".", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604280592__new.png"}, {"comment_id": "comment_1604282377", "author": "T", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert https://cayimby.org/blog/paying-the-ultimate-price-for-housing-the-case-for-affordability/", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604282377__new.png"}, {"comment_id": "comment_1604284387", "author": "T", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert Simply unleashing developers to build more homes won’t make housing affordable, the paper says. It explores a hypothetical: Imagine that a city increases its housing stock by 1.5 percent each year — a rate that is more than twice the growth of New York or San Francisco from 2000 to 2020, though lower than Denver, Phoenix or Houston.\n\nIf all that new housing caused prices to fall by 4 percent a year, it would take 18 years before a median one-bedroom apartment becomes affordable for a worker without a college education in San Francisco, or 11 years in the District or eight years in Boston, the paper says. If housing prices fall more slowly, less than 1 percent per year, it would take as much as 124 years in San Francisco and 109 years in Los Angeles.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604284387__new.png"}, {"comment_id": "comment_1604285024", "author": "T", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert https://www.washingtonpost.com/business/2026/02/01/yimby-housing-afforsdability/", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604285024__new.png"}, {"comment_id": "comment_1604299549", "author": "R", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "TOM the CA YIMBY source provided doesn’t state they want the value of homes to decline 30%, can you provide a source for that claim?", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604299549__new.png"}, {"comment_id": "comment_1604389215", "author": "C", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "I’ve lived and loved  marin for many yrs. Years ago the “tam  housing” in Corte Madera  development went in w/ a lot of anger at the oversized. development,   @They offered some 2 different levels of lower priced units. The next to lowest price was far more costly than a comparable apt in central marin. The “most affordable “ unit was still higher than the apt I lived in for many years , so when it became available on a lottery system,  I rejected it. All this to say how “affordable “ in marin is out of scale for the people who are protesting that we need “work force housing “ It is a ruse and will only destroy what we all love about this community.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604389215__new.png"}, {"comment_id": "comment_1604413680", "author": "W", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lito Wrong.  Supply increased naturally to meet demand all during the 1950s, 1960s and early 1970s - think all those G. I. Joe homes in Corte Madera under $10k, Eichlers (and his imitators) starting at $20k and moving into the $30k range, plus Kaehler/Timmer  subdivisions in 1970s Novato. \n\nThen someone starting to call these perfectly honest builders \"greedy\" and all the municipalities (beginning a bit north actually, in Petaluma) started to say \"No\" to any kind of growth.  The more extreme people generally wanted no more humans, but that's another story. \n\nOur $36k Upper Lucas Valley Eichler (1965), went to $80k (1975), $150k (1979), $235 k (1985)...last sold in 2023 for a cool $2,000,000.  BTW inflation accounts for only a small part of that - $36k in 1965 equals $345k today, affordable for a 4-bedroom, 2 bath, 2,000 sq.  ft. home - FAMILY friendly. \n\nAll the rest is because supply got throttled.  Developers (the bad guys) got told \"No.\"  Review times escalated - for everything.  Permit costs went up 20X.  For years in Marin they wouldn't give anyone water  meters - and if you talked about increasing the supply of water, YOU were shouted down by the \"No Growth\" fanatics - some of them fans of charlatan (despite his Stanford credentials) Paul Erlich who told us the entire planet was headed for famine. \n\nI was here. I saw all of it.  Please get your Marin history straight before opining.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604413680__new.png"}, {"comment_id": "comment_1604439134", "author": "P", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert is that why manhattan has more supply than anywhere with even higher prices than here?", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604439134__new.png"}, {"comment_id": "comment_1604440942", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lito even if you don't agree with supply and demand, the other side of this is taxes. If we don't increase our base (property and commercial) we will be forced to raise rates or give up on threatened areas of sea level rise.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604440942__new.png"}, {"comment_id": "comment_1604546493", "author": "T", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert Attend one of their meetings. It's enlightening.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604546493__new.png"}, {"comment_id": "comment_1604552303", "author": "T", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert Another YIMBY supporter here -- Colin Crook. \"my DMs are open and I'm happy to talk about my experiences with YIMBY orgs. Market rate is good. Filtering is real. Build some apartments and let the market do its thing. If your home's equity dropped 25-35% would that REALLY be the worst thing? It wouldn't.\"", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604552303__new.png"}, {"comment_id": "comment_1604560826", "author": "R", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "TOM I asked if there were any advocacy/policy groups that support a certain position, and you provided a CA YIMBY post as a source. When the source didn’t support the claim you said it did, your follow up is to quote a person on Nextdoor expressing a personal opinion? Please try to engage in constructive dialogue instead of creating straw man arguments", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604560826__new.png"}, {"comment_id": "comment_1604570482", "author": "R", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron every new condo/home built will contribute about 1.6x in property taxes every year compared to what the average homeowner in a home with the same value. Average homeowner in the bay area has lived in their home for 18 years, home prices have grown by about 60% since 2008.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604570482__new.png"}, {"comment_id": "comment_1604573331", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert and thats just residential. We're talking about commercial primarily which means people who work here, buy goods and pay sales tax too. If we're serious about economic engines it's time to put this thing into gear", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604573331__new.png"}, {"comment_id": "comment_1604589563", "author": "R", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron Agreed, I would not be surprised if most of Sausalito’s commercial land is paying taxes on its value in the 1980s", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604589563__new.png"}, {"comment_id": "comment_1604673159", "author": "L", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Walter Been in the same Sausalito house since 1940.  When my folks bought it from my Dad's folks, in 1968, it went for FIVE TIMES AS MUCH, in today's dollars, as my grandparents bought it for, in today's dollars, a generation before.  The exact same house.  This in spite of two plus decades of aggressively adding housing here in Marin and all over CA after the War.  In fact, at the time my folks bought this place, Marincello was slated to be built nearby.  So if there would ever have been a perception of housing abundance here in Marin, it would've been then.  Yet, the EXACT SAME HOUSE COST FIVE TIMES AS MUCH.  Tell me again about supply and demand?  Zoom out, chief, chronologically and geographically.  The problem with the supply and demand argument is that the \"demand\" part of the equation has proved to be an insatiable hydra. There is also a concept called induced demand, are you familiar? CA has built SO aggressively, and SO effectively, that 1 in 8 Americans now lives here.  Yet, we are more oversubscribed, and LESS affordable, by far, than ever.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604673159__new.png"}, {"comment_id": "comment_1604680961", "author": "L", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Walter In other words those numbers you cite DON'T represent a downward trend in housing prices from a generation before, do they?  Which is what this simplistic \"supply and demand\" argument would have us believe will happen.  No matter what we do, in terms of building, the cost of housing just seems to go up, up, up.  We need to use our imaginations a little more than doing the same thing and expecting different results.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604680961__new.png"}, {"comment_id": "comment_1604734254", "author": "W", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lito You have misunderstood what I said.  I never said prices went down between 1945 and 1969 because we increased supply.  I said that we kept supply balanced with demand; \"supply increased naturally to meet demand\" were my exact words.  No need during that period BEFORE \"no-growth\" for building a seeming surfeit to bring prices down.   It was \"no growth\" and its cousin \"limited growth\" policies  (1975 to the present)that brought us to our current state of artificial price inflation - we will need to build A Lot to overcome it. \n\nCurious re: your grandparents' place as to the actual (not inflation adjusted) numbers matched with years.\n\nI would say tha Sausalito is pretty rarified territory.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604734254__new.png"}, {"comment_id": "comment_1604843758", "author": "L", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Walter Yeah I don't know, I just know what my grandparents paid and what my parents paid, for the same house, and asked Google, how much was x in year y in 2026 dollars?  And in 2026 dollars it cost 5 times more in 1968 than it did in 1940, in spite of the frenzy of postWar building (in fact it was precisely the anxiety over the rate and pace of development that led to the preservation of the open spaces, from the Headlands to Point Reyes to Angel Island to China Camp, etc.)  It would be easy enough to verify, though, a very basic research project (albeit for someone more savvy than myself):  How much did people pay for a home in Marin/the Bay in 1940?  1950?  1960?  Etc., etc., in 2026 dollars?  I'm confident you would find that, no matter how much housing we built in a particular decade, housing did nothing but increase in cost, by a lot.  Also, when you consider that 1 in 8 Americans lives in CA already, and 10 or more people die on CA's roads every day, it doesn't seem unreasonable to ask:  How much more of the nation's growth is CA expected to absorb?  The more people we have absorbed here, the LESS awesome it seems to have gotten, for everybody concerned.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604843758__new.png"}, {"comment_id": "comment_1604847875", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "for those who made this into a housing argument, that's not what we're discussing here. The state (as we all now know) has ways of dealing with the overwhelming demand for housing, whether we like it or not.\n\nI would like to take the conversation back to the heart of what the initiative is actually discussing, which is to allow artists, industries and businesses (particular maritime businesses) to thrive by creating more supply of buildable areas. In commercial, rents do go down when there is more supply (yes, even in California). And importantly, provides an actual pathway to PAY for the much needed structural improvement to continue to make the Marinship inhabitable in the face of sea level rise.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604847875__new.png"}, {"comment_id": "comment_1604858845", "author": "L", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Community Land Trusts are the best way to exert community control over housing AND commercial.  With a robustly resourced CLT, we could claw back residential AND commercial properties as they turn over, which they do, at a pretty steady rate.  Sausalito-Marin City is at least 50-60 years overdue for a CLT.  Zero in on the spaces that already exist, building more and leaving it up to \"the market\" is how we got in this mess, with the only answer to \"who/what is going to be here\" being, \"the highest bidder.\"  In the absence of a patron like Arques, you need a CLT.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604858845__new.png"}, {"comment_id": "comment_1604971288", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lito that's a great idea. CLTs arent the only tool however and as you can imagine the initial capital to secure them is a major hurdle. CDAs can offer the same protections without the need for a large amount of starting capital but require the involvement of city government.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604971288__new.png"}, {"comment_id": "comment_1604986582", "author": "L", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron, the cliche \"laws of supply and demand disagree\" cannot be applied to absolutely every commodity out there, as Amy has just very well explained.  FYI.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1604986582__new.png"}, {"comment_id": "comment_1605277616", "author": "L", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron Yeah, check out the excellent work that the Pt. Reyes CLT (acronym \"CLAM\") is doing.  Bolinas has a good one too.  Why not Sausalito-Marin City?  I talked to a teacher at Bayside/Willow Creek, now the Nevada Street campus of MLK Academy, and she told me she lives in TRACY!  Seems reasonable to suggest -- and INSIST -- that CLTs ought to get some reasonable percentage of the public monies we are perpetually throwing at roads and freeways to fully subsidize commutes, in order to OBVIATE those commutes, by providing housing in the \"communities\" people serve.  What's a CDA?", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1605277616__new.png"}, {"comment_id": "comment_1605286184", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lito here's a quick summary: https://brownfirm.law/glossary/community-development-agreement/ It accomplishes an identical thing to what you're suggesting but solves the complex startup capital. We can find great solutions if we work together.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1605286184__new.png"}, {"comment_id": "comment_1605287875", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Liz Amy is taking about housing stock and I agree that curve is likely inelastic. However, commercial rents (and those for artists) are not saturated and therefore the normal economic effects apply. I've spoken to several artists local who would love to be the in the ICB building. Guess what we can't build another right now? Is that what you want?", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1605287875__new.png"}, {"comment_id": "comment_1605302446", "author": "L", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "I don't believe you can have a thriving, viable, authentic arts scene if those artists have no place to live, if they're commuting in from Antioch every day.  The famous wild ferment that characterized \"the Gates\" owed a LOT to the fact that it was ALL low cost, and NO cost, housing at the time (thanks, of course, to the great arts and culture patron Arques).  I would compare these modern day southern Marin \"communities\" to an organism undergoing daily dialysis, as the people who are their lifeblood, those providing the critical ecological services keeping them alive, are compelled to enter and exit every day, from furhter and further away with each passing generation. https://www.kqed.org/arts/13989682/artist-housing-advocates-eye-a-once-in-100-year-opportunity", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1605302446__new.png"}, {"comment_id": "comment_1605641803", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lito SF has many live/work units for this reason. Conceivably this could be possible here too!", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1605641803__new.png"}, {"comment_id": "comment_1608439043", "author": "J", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "\"When you increase supply you drive down prices\" is a pretty huge generalization-are you referencing a particular absorption study for the areas where the building will take place, the price range, and the types of units?  An overbuilt downtown San Rafael with a very high vacancy rate does not necessarily mean all units in San Rafael or even the greater Bay Area will be affected.  As an example, the commercial vacancy rate in San Rafael was increased dramatically by development of several large, newer buildings but demand for smaller units remained consistently high.  High rise apartments are not the same market as SFH and so on", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1608439043__new.png"}, {"comment_id": "comment_1608441932", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T13:48:24Z", "observed_at": "2026-05-26T13:49:52Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Jodie it is certainly nuanced but the opposite logic (prices going up) is similarly not proven", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T13-48-24Z__comment_1608441932__new.png"}, {"comment_id": "comment_1604033815", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604038610", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604160943", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604164999", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604227951", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604240183", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604240780", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604245622", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604250347", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026- t": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604847875", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604858845", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604971288", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604986582", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1605277616", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1605286184", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1605287875", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1605302446", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1605641803", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1608439043", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1608441932", "author": null, "klass": "deleted", "run_id": "2026-05-26T18:18:23Z", "observed_at": "2026-05-26T18:19:38Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604033815", "author": "L", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Increasing supply has never driven down prices in the Bay Area, going all the way back to the end of WWII.  Not once.  Why would anyone think that it magically will now?", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604033815__new.png"}, {"comment_id": "comment_1604038610", "author": "P", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "You’re forgetting an extremely important point. The price will only come down when supply exceeds the number of buyers willing to pay the high price. Or, you can increase housing to the point the area is no longer desirable and prices will come down. My guess is you’ll hit the latter first.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604038610__new.png"}, {"comment_id": "comment_1604160943", "author": "A", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Supply and demand for housing as a commodity is different from consumables. That’s because “housing” isn’t “housing.” Increasing market rate units will potentially have a slight effect among market rate units, but if incomes spike and an area is desirable and has maxed out its capacity for growth and infrastructure the prices don’t come down…someone with plenty of money can buy or rent just to hold a place for occasional use. \n\nThat takes the unit off the market that serves locals; it induces more people to buy or rent from out of the area without need. An oversupply of some types of units can affect the pricing of those just adjacent in pricing, but at the point where prices start to fall at all the development stops because it is no longer profitable. \n\nOur housing policy doesnt account for that; cities are still  judged by “permits pulled” (to build) , not even by approvals or entitlements.\n\nNone of the market rate unit activity will ever help people living at  actual low income price points. As nothing is being built in those categories, the supply becomes very lopsided; large vacancy rates at the high end, increasingly lower availability at the low end. \n\nOur “low income” units are built for earners starting at $109,000. This has zero effect on the workforce that people frequently describe here as benefiting. Day workers, anyone close to minimum wage is unaccounted for on the RHNA (mandate) charts. Literally no increase in supply there — it’s the opposite. \n\nWhen Naturally occurring, older stock where people have been aging in place is upgraded or demolished for new housing the prices will never return to the fixed income level people had been paying. \n\nUnits cost about $1m  to construct. All units in our area. So the math says the prices go up. Without subsidy new housing becomes unaffordable to all but “good” earners.  “More housing”is used in a sentence the  same  way as “job growth.” \n\nJob growth is also inclusive number not broken down by income category except for market analysts  for economists. \n\nCreating 100 warehouse jobs is not the same as creating 100  software engineer jobs — but statistically and for general “news” reporting they are  lumped together.  \n\nThe jobs being created now swing wildly at two ends:  high and low. But the housing is only serving one of them.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604160943__new.png"}, {"comment_id": "comment_1604164999", "author": "R", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Paul so prices only go down when supply exceeds demand, or when supply exceeds demand? Sure sounds like we should consider letting supply exceed demand", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604164999__new.png"}, {"comment_id": "comment_1604227951", "author": "P", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert over the last 50 yrs we have doubled the number of houses in Marin and the prices have gone up 1,400%. So far more housing hasn’t reduced prices. You’ll make the area an undesirable mess before you run out of people willing to pay the high prices. So it sure sounds like you’re advocating to make Marin an undesirable place to live and that’s disappointing.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604227951__new.png"}, {"comment_id": "comment_1604240183", "author": "T", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert But therein lies the problem. If supply does exceed demand an prices do drop -- they drop for everyone to include current home equity holders.  YIMBY  suggests a drop of up to 30% (voodoo economics) meaning if you have a condo valued at $1mm - 30% in value, your condo is now ~$700k. You just took a $300k haircut -- AND that's if you have equity.   There will be many with negative equity which is one missed payment away from walking away.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604240183__new.png"}, {"comment_id": "comment_1604240780", "author": "R", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Paul according to the 1980 census, there were 88,000 households in Marin, and today there are 103,000 households, with the bulk of that growth happening north of San Rafael. In 1980 the population of California was 23,000,000, today it’s almost 40,000,000. Hard to see that doesn’t increase relative demand for homes in Marin.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604240780__new.png"}, {"comment_id": "comment_1604245622", "author": "R", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "TOM please cite your source, I am not familiar with any group focusing on a decline in property values by a specific number", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604245622__new.png"}, {"comment_id": "comment_1604250347", "author": "T", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Amy This situation is becoming overcomplicated. The first principle concept is human nature. People want to work hard and make a lot of money. Then they want to live in a very nice area. The issue we're currently facing in Marin has been going on for 100's of years all over the world. The center of Paris, Jackson Hole, Aspen, the Hamptons etc etc. At some point we as human beings must accept we can't solve this -- only manage it. Extremely expensive areas will ALWAYS suffer that the people that support the community cannot afford to live there. That is a simple and hard fact. We can manage it to a certain degree -- but we can't fix with these over simplistic solutions put up by Trojan Horse groups like YIMBY. They present a solution which is just a self enrichment scheme which allows them to move on to the next high value community to savage whilst extracting as much money as possible from their current target. We just need to accept facts and not follow the siren song of non-solution -- solutions.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604250347__new.png"}, {"comment_id": "comment_1604270977", "author": "A", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "TOM I agree with you. And if we want to ameliorate the situation, we need to focus on available land — not clog it with luxury development with density bonuses and concessions — and instead focus on need and funding. Without forethought all of the areas you’ve mentioned have eliminated NOAH  and priced out workforce. So real decisions need to be made about what we are actually trying to accomplish. What’s happening right now is the opposite.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604270977__new.png"}, {"comment_id": "comment_1604277142", "author": "Roger Howard", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "TOM some others on this thread speak well to this issue of high cost of housing in Marin and why. Your paragraph summarizes all others attempts perfectly.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604277142__new.png"}, {"comment_id": "comment_1604280592", "author": "T", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert YIMBY routinely states that they want a 25-30% reduction in home values to make it more affordable to live in \"wealthy neighborhoods\" They use several different forms of calculus such as no more than 30% of your income to housing,  in order for Marin to become more affordable -- well you can do the math. I've attended their meetings and this is their bogey in residential valuation to make things \"affordable\".", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604280592__new.png"}, {"comment_id": "comment_1604282377", "author": "T", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert https://cayimby.org/blog/paying-the-ultimate-price-for-housing-the-case-for-affordability/", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604282377__new.png"}, {"comment_id": "comment_1604284387", "author": "T", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert Simply unleashing developers to build more homes won’t make housing affordable, the paper says. It explores a hypothetical: Imagine that a city increases its housing stock by 1.5 percent each year — a rate that is more than twice the growth of New York or San Francisco from 2000 to 2020, though lower than Denver, Phoenix or Houston.\n\nIf all that new housing caused prices to fall by 4 percent a year, it would take 18 years before a median one-bedroom apartment becomes affordable for a worker without a college education in San Francisco, or 11 years in the District or eight years in Boston, the paper says. If housing prices fall more slowly, less than 1 percent per year, it would take as much as 124 years in San Francisco and 109 years in Los Angeles.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604284387__new.png"}, {"comment_id": "comment_1604285024", "author": "T", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert https://www.washingtonpost.com/business/2026/02/01/yimby-housing-afforsdability/", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604285024__new.png"}, {"comment_id": "comment_1604299549", "author": "R", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "TOM the CA YIMBY source provided doesn’t state they want the value of homes to decline 30%, can you provide a source for that claim?", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604299549__new.png"}, {"comment_id": "comment_1604389215", "author": "C", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "I’ve lived and loved  marin for many yrs. Years ago the “tam  housing” in Corte Madera  development went in w/ a lot of anger at the oversized. development,   @They offered some 2 different levels of lower priced units. The next to lowest price was far more costly than a comparable apt in central marin. The “most affordable “ unit was still higher than the apt I lived in for many years , so when it became available on a lottery system,  I rejected it. All this to say how “affordable “ in marin is out of scale for the people who are protesting that we need “work force housing “ It is a ruse and will only destroy what we all love about this community.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604389215__new.png"}, {"comment_id": "comment_1604413680", "author": "W", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lito Wrong.  Supply increased naturally to meet demand all during the 1950s, 1960s and early 1970s - think all those G. I. Joe homes in Corte Madera under $10k, Eichlers (and his imitators) starting at $20k and moving into the $30k range, plus Kaehler/Timmer  subdivisions in 1970s Novato. \n\nThen someone starting to call these perfectly honest builders \"greedy\" and all the municipalities (beginning a bit north actually, in Petaluma) started to say \"No\" to any kind of growth.  The more extreme people generally wanted no more humans, but that's another story. \n\nOur $36k Upper Lucas Valley Eichler (1965), went to $80k (1975), $150k (1979), $235 k (1985)...last sold in 2023 for a cool $2,000,000.  BTW inflation accounts for only a small part of that - $36k in 1965 equals $345k today, affordable for a 4-bedroom, 2 bath, 2,000 sq.  ft. home - FAMILY friendly. \n\nAll the rest is because supply got throttled.  Developers (the bad guys) got told \"No.\"  Review times escalated - for everything.  Permit costs went up 20X.  For years in Marin they wouldn't give anyone water  meters - and if you talked about increasing the supply of water, YOU were shouted down by the \"No Growth\" fanatics - some of them fans of charlatan (despite his Stanford credentials) Paul Erlich who told us the entire planet was headed for famine. \n\nI was here. I saw all of it.  Please get your Marin history straight before opining.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604413680__new.png"}, {"comment_id": "comment_1604439134", "author": "P", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert is that why manhattan has more supply than anywhere with even higher prices than here?", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604439134__new.png"}, {"comment_id": "comment_1604440942", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lito even if you don't agree with supply and demand, the other side of this is taxes. If we don't increase our base (property and commercial) we will be forced to raise rates or give up on threatened areas of sea level rise.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604440942__new.png"}, {"comment_id": "comment_1604546493", "author": "T", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert Attend one of their meetings. It's enlightening.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604546493__new.png"}, {"comment_id": "comment_1604552303", "author": "T", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert Another YIMBY supporter here -- Colin Crook. \"my DMs are open and I'm happy to talk about my experiences with YIMBY orgs. Market rate is good. Filtering is real. Build some apartments and let the market do its thing. If your home's equity dropped 25-35% would that REALLY be the worst thing? It wouldn't.\"", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604552303__new.png"}, {"comment_id": "comment_1604560826", "author": "R", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "TOM I asked if there were any advocacy/policy groups that support a certain position, and you provided a CA YIMBY post as a source. When the source didn’t support the claim you said it did, your follow up is to quote a person on Nextdoor expressing a personal opinion? Please try to engage in constructive dialogue instead of creating straw man arguments", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604560826__new.png"}, {"comment_id": "comment_1604570482", "author": "R", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron every new condo/home built will contribute about 1.6x in property taxes every year compared to what the average homeowner in a home with the same value. Average homeowner in the bay area has lived in their home for 18 years, home prices have grown by about 60% since 2008.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604570482__new.png"}, {"comment_id": "comment_1604573331", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Robert and thats just residential. We're talking about commercial primarily which means people who work here, buy goods and pay sales tax too. If we're serious about economic engines it's time to put this thing into gear", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604573331__new.png"}, {"comment_id": "comment_1604589563", "author": "R", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron Agreed, I would not be surprised if most of Sausalito’s commercial land is paying taxes on its value in the 1980s", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604589563__new.png"}, {"comment_id": "comment_1604673159", "author": "L", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Walter Been in the same Sausalito house since 1940.  When my folks bought it from my Dad's folks, in 1968, it went for FIVE TIMES AS MUCH, in today's dollars, as my grandparents bought it for, in today's dollars, a generation before.  The exact same house.  This in spite of two plus decades of aggressively adding housing here in Marin and all over CA after the War.  In fact, at the time my folks bought this place, Marincello was slated to be built nearby.  So if there would ever have been a perception of housing abundance here in Marin, it would've been then.  Yet, the EXACT SAME HOUSE COST FIVE TIMES AS MUCH.  Tell me again about supply and demand?  Zoom out, chief, chronologically and geographically.  The problem with the supply and demand argument is that the \"demand\" part of the equation has proved to be an insatiable hydra. There is also a concept called induced demand, are you familiar? CA has built SO aggressively, and SO effectively, that 1 in 8 Americans now lives here.  Yet, we are more oversubscribed, and LESS affordable, by far, than ever.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604673159__new.png"}, {"comment_id": "comment_1604680961", "author": "L", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Walter In other words those numbers you cite DON'T represent a downward trend in housing prices from a generation before, do they?  Which is what this simplistic \"supply and demand\" argument would have us believe will happen.  No matter what we do, in terms of building, the cost of housing just seems to go up, up, up.  We need to use our imaginations a little more than doing the same thing and expecting different results.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604680961__new.png"}, {"comment_id": "comment_1604734254", "author": "W", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lito You have misunderstood what I said.  I never said prices went down between 1945 and 1969 because we increased supply.  I said that we kept supply balanced with demand; \"supply increased naturally to meet demand\" were my exact words.  No need during that period BEFORE \"no-growth\" for building a seeming surfeit to bring prices down.   It was \"no growth\" and its cousin \"limited growth\" policies  (1975 to the present)that brought us to our current state of artificial price inflation - we will need to build A Lot to overcome it. \n\nCurious re: your grandparents' place as to the actual (not inflation adjusted) numbers matched with years.\n\nI would say tha Sausalito is pretty rarified territory.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604734254__new.png"}, {"comment_id": "comment_1604843758", "author": "L", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Walter Yeah I don't know, I just know what my grandparents paid and what my parents paid, for the same house, and asked Google, how much was x in year y in 2026 dollars?  And in 2026 dollars it cost 5 times more in 1968 than it did in 1940, in spite of the frenzy of postWar building (in fact it was precisely the anxiety over the rate and pace of development that led to the preservation of the open spaces, from the Headlands to Point Reyes to Angel Island to China Camp, etc.)  It would be easy enough to verify, though, a very basic research project (albeit for someone more savvy than myself):  How much did people pay for a home in Marin/the Bay in 1940?  1950?  1960?  Etc., etc., in 2026 dollars?  I'm confident you would find that, no matter how much housing we built in a particular decade, housing did nothing but increase in cost, by a lot.  Also, when you consider that 1 in 8 Americans lives in CA already, and 10 or more people die on CA's roads every day, it doesn't seem unreasonable to ask:  How much more of the nation's growth is CA expected to absorb?  The more people we have absorbed here, the LESS awesome it seems to have gotten, for everybody concerned.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604843758__new.png"}, {"comment_id": "comment_1604847875", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "for those who made this into a housing argument, that's not what we're discussing here. The state (as we all now know) has ways of dealing with the overwhelming demand for housing, whether we like it or not.\n\nI would like to take the conversation back to the heart of what the initiative is actually discussing, which is to allow artists, industries and businesses (particular maritime businesses) to thrive by creating more supply of buildable areas. In commercial, rents do go down when there is more supply (yes, even in California). And importantly, provides an actual pathway to PAY for the much needed structural improvement to continue to make the Marinship inhabitable in the face of sea level rise.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604847875__new.png"}, {"comment_id": "comment_1604858845", "author": "L", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Community Land Trusts are the best way to exert community control over housing AND commercial.  With a robustly resourced CLT, we could claw back residential AND commercial properties as they turn over, which they do, at a pretty steady rate.  Sausalito-Marin City is at least 50-60 years overdue for a CLT.  Zero in on the spaces that already exist, building more and leaving it up to \"the market\" is how we got in this mess, with the only answer to \"who/what is going to be here\" being, \"the highest bidder.\"  In the absence of a patron like Arques, you need a CLT.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604858845__new.png"}, {"comment_id": "comment_1604971288", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lito that's a great idea. CLTs arent the only tool however and as you can imagine the initial capital to secure them is a major hurdle. CDAs can offer the same protections without the need for a large amount of starting capital but require the involvement of city government.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604971288__new.png"}, {"comment_id": "comment_1604986582", "author": "L", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron, the cliche \"laws of supply and demand disagree\" cannot be applied to absolutely every commodity out there, as Amy has just very well explained.  FYI.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1604986582__new.png"}, {"comment_id": "comment_1605277616", "author": "L", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Aaron Yeah, check out the excellent work that the Pt. Reyes CLT (acronym \"CLAM\") is doing.  Bolinas has a good one too.  Why not Sausalito-Marin City?  I talked to a teacher at Bayside/Willow Creek, now the Nevada Street campus of MLK Academy, and she told me she lives in TRACY!  Seems reasonable to suggest -- and INSIST -- that CLTs ought to get some reasonable percentage of the public monies we are perpetually throwing at roads and freeways to fully subsidize commutes, in order to OBVIATE those commutes, by providing housing in the \"communities\" people serve.  What's a CDA?", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1605277616__new.png"}, {"comment_id": "comment_1605286184", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lito here's a quick summary: https://brownfirm.law/glossary/community-development-agreement/ It accomplishes an identical thing to what you're suggesting but solves the complex startup capital. We can find great solutions if we work together.", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1605286184__new.png"}, {"comment_id": "comment_1605287875", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Liz Amy is taking about housing stock and I agree that curve is likely inelastic. However, commercial rents (and those for artists) are not saturated and therefore the normal economic effects apply. I've spoken to several artists local who would love to be the in the ICB building. Guess what we can't build another right now? Is that what you want?", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1605287875__new.png"}, {"comment_id": "comment_1605302446", "author": "L", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "I don't believe you can have a thriving, viable, authentic arts scene if those artists have no place to live, if they're commuting in from Antioch every day.  The famous wild ferment that characterized \"the Gates\" owed a LOT to the fact that it was ALL low cost, and NO cost, housing at the time (thanks, of course, to the great arts and culture patron Arques).  I would compare these modern day southern Marin \"communities\" to an organism undergoing daily dialysis, as the people who are their lifeblood, those providing the critical ecological services keeping them alive, are compelled to enter and exit every day, from furhter and further away with each passing generation. https://www.kqed.org/arts/13989682/artist-housing-advocates-eye-a-once-in-100-year-opportunity", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1605302446__new.png"}, {"comment_id": "comment_1605641803", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Lito SF has many live/work units for this reason. Conceivably this could be possible here too!", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1605641803__new.png"}, {"comment_id": "comment_1608439043", "author": "J", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "\"When you increase supply you drive down prices\" is a pretty huge generalization-are you referencing a particular absorption study for the areas where the building will take place, the price range, and the types of units?  An overbuilt downtown San Rafael with a very high vacancy rate does not necessarily mean all units in San Rafael or even the greater Bay Area will be affected.  As an example, the commercial vacancy rate in San Rafael was increased dramatically by development of several large, newer buildings but demand for smaller units remained consistently high.  High rise apartments are not the same market as SFH and so on", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1608439043__new.png"}, {"comment_id": "comment_1608441932", "author": "Aaron Nathan", "klass": "new", "run_id": "2026-05-26T18:48:54Z", "observed_at": "2026-05-26T18:50:31Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "Jodie it is certainly nuanced but the opposite logic (prices going up) is similarly not proven", "screenshot": "data/posts/p_8WCk9yGH7bwn/captures/2026-05-26T18-48-54Z__comment_1608441932__new.png"}, {"comment_id": "comment_1604033815", "author": null, "klass": "deleted", "run_id": "2026-05-28T01:49:02Z", "observed_at": "2026-05-28T01:50:24Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604038610", "author": null, "klass": "deleted", "run_id": "2026-05-28T01:49:02Z", "observed_at": "2026-05-28T01:50:24Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604160943", "author": null, "klass": "deleted", "run_id": "2026-05-28T01:49:02Z", "observed_at": "2026-05-28T01:50:24Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604164999", "author": null, "klass": "deleted", "run_id": "2026-05-28T01:49:02Z", "observed_at": "2026-05-28T01:50:24Z", "is_reply": false, "parent_comment_id": null, "timestamp_ r_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604280592", "author": null, "klass": "deleted", "run_id": "2026-05-28T01:49:02Z", "observed_at": "2026-05-28T01:50:24Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604282377", "author": null, "klass": "deleted", "run_id": "2026-05-28T01:49:02Z", "observed_at": "2026-05-28T01:50:24Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604284387", "author": null, "klass": "deleted", "run_id": "2026-05-28T01:49:02Z", "observed_at": "2026-05-28T01:50:24Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604285024", "author": null, "klass": "deleted", "run_id": "2026-05-28T01:49:02Z", "observed_at": "2026-05-28T01:50:24Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604299549", "author": null, "klass": "deleted", "run_id": "2026-05-28T01:49:02Z", "observed_at": "2026-05-28T01:50:24Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604389215", "author": null, "klass": "deleted", "run_id": "2026-05-28T01:49:02Z", "observed_at": "2026-05-28T01:50:24Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text": "", "screenshot": null}, {"comment_id": "comment_1604413680", "author": null, "klass": "deleted", "run_id": "2026-05-28T01:49:02Z", "observed_at": "2026-05-28T01:50:24Z", "is_reply": false, "parent_comment_id": null, "timestamp_text": null, "edited_marker_text": null, "body_text"
