[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextdoor-watcher"
version = "0.1.0"
description = "One-shot, cron-friendly scraper that captures new/edited/deleted comments on watched Nextdoor posts as screenshots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
nextdoor-watcher = "nextdoor_watcher.cli:main"

[tool.setuptools.packages.find]
include = ["nextdoor_watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
